  const oldOpen=window.openDay;window.openDay=async function(id){try{if(mode==='real'&&user?.id){const q=await sb.from('workout_sessions').select('program_day_id,started_at').eq('client_id',user.id).eq('status','in_progress').order('started_at',{ascending:false}).limit(1).maybeSingle();if(q.data?.program_day_id&&q.data.program_day_id!==id){id=q.data.program_day_id;toast?.('Ya tenías una sesión activa · la recuperé')}}}catch(e){console.warn('v25 active workout',e)}return oldOpen.call(this,id)};
  window.cvToggleSet=async function(i,j){
    if(!workout?.sessionId){await window.startWorkout();if(!workout?.sessionId)return}
    const ex=typeof cvExercises==='function'?cvExercises()?.[i]:null,s=ex?.sets?.[j];if(!ex||!s)return;
    const wi=document.getElementById('cvw_'+i+'_'+j),ri=document.getElementById('cvr_'+i+'_'+j),w=wi&&wi.value!==''?Number(wi.value):null,r=ri&&ri.value!==''?Math.round(Number(ri.value)):null;if(w!=null&&!Number.isFinite(w))return toast?.('Revisa el peso.');if(r==null||!Number.isFinite(r)||r<=0)return toast?.('Ingresa las repeticiones realizadas.');
    const next=!s.completed,old={w:s.weight_kg,r:s.reps,c:s.completed};s.weight_kg=w;s.reps=r;s.completed=next;
    const row=wi?.closest('.cvSetRow'),btn=row?.querySelector('.cvSetCheck');row?.classList.toggle('done',next);btn?.classList.toggle('done',next);updateStats();const card=row?.closest('.cvHevyExercise'),all=ex.sets||[],done=all.filter(x=>x.completed).length;card?.classList.toggle('cvExerciseHasProgress',done>0);card?.classList.toggle('cvExerciseComplete',all.length>0&&done===all.length);if(next)startRest(ex.rest_seconds||90,ex.name);
    if(mode==='demo'||!s.set_log_id)return;
    try{const {error}=await sb.from('set_logs').update({weight_kg:w,reps:r,completed:next,completed_at:next?new Date().toISOString():null,source:'manual'}).eq('id',s.set_log_id);if(error)throw error}catch(e){s.weight_kg=old.w;s.reps=old.r;s.completed=old.c;row?.classList.toggle('done',old.c);btn?.classList.toggle('done',old.c);updateStats();if(next)stopRest();toast?.('No pude guardar la serie. Se revirtió para proteger tus datos.')}
  };
  const baseRender=window.render;window.render=function(){const r=baseRender.apply(this,arguments);requestAnimationFrame(()=>{setNav();fixHeader();decorateHistory();ensureDock()});return r};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&restEnd)tickRest()});window.addEventListener('pageshow',()=>{if(restEnd)tickRest()});requestAnimationFrame(()=>{setNav();fixHeader();decorateHistory();restoreRest()});
})();
</script>
<script id="cv-client-notifications-v1-js">
(function(){
  let notificationRows=[],notificationRequest=null,notificationError='';
  const notificationTypes={onboarding_approved:'Onboarding aprobado',onboarding_changes_requested:'Cambios solicitados',adaptive_mission:'Misión adaptativa',mission_completed:'Misión completada',achievement_unlocked:'Logro desbloqueado',level_up:'Subida de nivel'};
  const notificationType=v=>notificationTypes[String(v||'').toLowerCase()]||'Notificación';
  const notificationDate=v=>{try{return new Intl.DateTimeFormat('es-CL',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch(_){return 'Fecha no disponible'}};
  function updateNotificationBadge(){const b=document.getElementById('cvNotificationBadge');if(!b)return;const count=notificationRows.filter(x=>!x.read_at).length;b.textContent=count>99?'99+':String(count);b.classList.toggle('hidden',count===0);b.setAttribute('aria-label',count+' notificaciones no leídas')}
  function safeNotificationView(url){if(typeof url!=='string'||!url||url.startsWith('//'))return null;try{const parsed=new URL(url,location.origin);if(parsed.origin!==location.origin)return null;const routes={'/':'home','/progress':'progress','/progress/missions':'missions'};return routes[parsed.pathname]||null}catch(_){return null}}
  function notificationShell(){return '<div class="ey">CENTRO PERSONAL</div><h1 style="font-size:39px;margin:5px 0">NOTIFICACIONES</h1><div class="sub">Novedades importantes de tu proceso, misiones y progreso.</div><div class="cvNotificationToolbar"><span id="cvNotificationStatus" class="cvNotificationStatus"></span><button id="cvMarkAll" class="btn" type="button">MARCAR TODAS COMO LEÍDAS</button></div><section class="section"><div id="cvNotificationList" class="cvNotificationList"></div></section>'}
  function renderNotificationList(){const list=document.getElementById('cvNotificationList');if(!list)return;list.replaceChildren();if(notificationError){const e=document.createElement('div');e.className='card cvNotificationError';e.textContent=notificationError;list.append(e);return}if(!notificationRows.length){const e=document.createElement('div');e.className='card empty';e.textContent='No tienes notificaciones todavía.';list.append(e);return}notificationRows.forEach(row=>{const item=document.createElement('article');item.className='card cvNotificationItem'+(row.read_at?'':' unread');item.dataset.notificationId=String(row.id);const meta=document.createElement('div');meta.className='cvNotificationMeta';const type=document.createElement('span');type.className='cvNotificationType';type.textContent=notificationType(row.type);const date=document.createElement('time');date.dateTime=String(row.created_at||'');date.textContent=notificationDate(row.created_at);meta.append(type,date);const title=document.createElement('div');title.className='cvNotificationTitle';title.textContent=String(row.title||'Notificación');const body=document.createElement('div');body.className='cvNotificationBody';body.textContent=String(row.body||'');const actions=document.createElement('div');actions.className='cvNotificationActions';if(!row.read_at){const read=document.createElement('button');read.className='btn';read.type='button';read.textContent='MARCAR COMO LEÍDA';read.onclick=()=>markNotification(row.id);actions.append(read)}const target=safeNotificationView(row.action_url);if(target){const go=document.createElement('button');go.className='btn primary';go.type='button';go.textContent='VER';go.onclick=()=>nav(target);actions.append(go)}item.append(meta,title,body,actions);list.append(item)})}
  async function refreshNotifications(){if(mode!=='real'||!user?.id){notificationRows=[];notificationError='';updateNotificationBadge();return}if(notificationRequest)return notificationRequest;const uid=user.id;notificationRequest=sb.from('notifications').select('id,user_id,type,title,body,action_url,read_at,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(50).then(({data,error})=>{if(error)throw error;notificationRows=data||[];notificationError='';updateNotificationBadge();if(view==='notifications')renderNotificationList()}).catch(error=>{notificationError='No se pudieron cargar las notificaciones. El resto del portal sigue disponible.';if(view==='notifications')renderNotificationList();console.warn('Notifications load failed',error)}).finally(()=>{notificationRequest=null});return notificationRequest}
  async function markNotification(id){const row=notificationRows.find(x=>String(x.id)===String(id));if(!row||row.read_at||mode!=='real'||!user?.id)return;const previous=row.read_at;try{const result=await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id).is('read_at',null);if(result.error)throw result.error;row.read_at=new Date().toISOString();updateNotificationBadge();renderNotificationList()}catch(error){row.read_at=previous;toast('No se pudo marcar la notificación.');console.warn('Notification update failed',error)}}
  async function markAllNotifications(){if(mode!=='real'||!user?.id)return;const unread=notificationRows.filter(x=>!x.read_at);if(!unread.length)return;const stamp=new Date().toISOString();try{const result=await sb.from('notifications').update({read_at:stamp}).eq('user_id',user.id).is('read_at',null);if(result.error)throw result.error;unread.forEach(x=>{x.read_at=stamp});updateNotificationBadge();renderNotificationList()}catch(error){toast('No se pudieron marcar todas como leídas.');console.warn('Notifications bulk update failed',error)}}
  window.openNotifications=function(){view='notifications';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));render();refreshNotifications()};
  const baseRender=window.render;window.render=function(){const result=baseRender.apply(this,arguments);if(view==='notifications'){const c=document.getElementById('content');if(c){c.innerHTML=notificationShell();document.getElementById('cvMarkAll').onclick=markAllNotifications;renderNotificationList()}}else if(view==='home'&&mode==='real'){refreshNotifications()}return result};
  const baseSetLogged=window.setLogged;window.setLogged=function(){const result=baseSetLogged.apply(this,arguments);refreshNotifications();return result};
  sb.auth.onAuthStateChange((event,session)=>{if(session?.user?.id){user=session.user;mode='real';if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'||event==='INITIAL_SESSION')refreshNotifications()}});
  updateNotificationBadge();
})();
</script></body></html>
