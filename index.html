function newProgramDay(id,days){let max=days.reduce((n,x)=>Math.max(n,Number(x.day_number)||0),0)+1;$('#modal').innerHTML=`<div class="modal"><div class="card"><div class="row"><div class="grow"><div class="ey">NUEVO DÍA</div><h2>Agregar día</h2></div><button id="closeDay" class="btn small">✕</button></div><label>Número de día</label><input id="newDayNumber" class="input" type="number" min="1" value="${max}"><label>Nombre obligatorio</label><input id="newDayName" class="input"><label>Enfoque</label><input id="newDayFocus" class="input"><label>Minutos estimados</label><input id="newDayMinutes" class="input" type="number" min="1" step="1"><label>Notas</label><textarea id="newDayNotes" class="input" rows="3"></textarea><button id="createDay" class="btn primary" style="width:100%">AGREGAR DÍA</button><div id="newDayStatus" class="status muted"></div></div></div>`;$('#closeDay').onclick=()=>$('#modal').innerHTML='';$('#createDay').onclick=async()=>{let number=Number($('#newDayNumber').value),name=$('#newDayName').value.trim(),minutesRaw=$('#newDayMinutes').value,minutes=minutesRaw===''?null:Number(minutesRaw),r=$('#newDayStatus');if(!Number.isInteger(number)||number<1)return r.textContent='El número de día debe ser un entero mayor que cero.';if(days.some(x=>Number(x.day_number)===number))return r.textContent='Ya existe otro día con ese número.';if(!name)return r.textContent='El nombre del día es obligatorio.';if(minutes!==null&&(!Number.isInteger(minutes)||minutes<=0))return r.textContent='Los minutos estimados deben ser un entero mayor que cero.';try{r.textContent='Guardando…';await ensureDraft(id);await req('/rest/v1/program_days',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({program_id:id,day_number:number,name,focus:$('#newDayFocus').value.trim()||null,estimated_minutes:minutes,notes:$('#newDayNotes').value.trim()||null})});$('#modal').innerHTML='';cache={};toast('Día agregado.');programEditor(id)}catch(e){r.textContent='No se pudo agregar: '+ function confirmPublish(id,name){$('#modal').innerHTML=`<div class="modal"><div class="card"><h2>Publicar programa</h2><p class="sub">¿Confirmas publicar “${esc(name||'Sin nombre')}”? El backend validará que el programa tenga ejercicios. Si rechaza la operación, el programa no se publicará.</p><div class="row"><button id="cancelPublish" class="btn grow">CANCELAR</button><button id="doPublish" class="btn primary grow">CONFIRMAR PUBLICACIÓN</button></div><div id="publishStatus" class="status muted"></div></div></div>`;$('#cancelPublish').onclick=()=>$('#modal').innerHTML='';$('#doPublish').onclick=async()=>{let r=$('#publishStatus'),b=$('#doPublish');try{b.disabled=true;r.textContent='Publicando…';await ensureDraft(id);await req('/rest/v1/rpc/publish_program_backend',{method:'POST',body:JSON.stringify({p_actor_id:me.id,p_program_id:id})});$('#modal').innerHTML='';cache={};toast('Programa publicado.');programEditor(id)}catch(e){r.textContent='El backend rechazó la publicación: '+e.message}finally{b.disabled=false}}}async function alerts(){let d=await core(true);$('#content').innerHTML=`<div class="ey">SEGUIMIENTO</div><h1 class="title">Alertas</h1><div class="stack">${d.alerts.map(a=>`<div class="card"><div class="row"><div class="grow"><b>${esc(a.title)}</b><div class="muted">${esc(a.message||'')}</div></div>${pill(a.severity)}${pill(a.status)}${a.status!=='resolved'?`<button class="btn good small resolve" data-id="${a.id}">Resolver</button>`:''}</div></div>`).join('')||'<div class="card muted">Sin alertas.</div>'}</div>`;$$('.resolve').forEach(b=>b.onclick=async()=>{await req('/rest/v1/coach_alerts?id=eq.'+b.dataset.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'resolved',resolved_at:new Date().toISOString()})});cache={};alerts()})}async function library(){let all=await table('exercises','active=eq.true&select=*&order=name'),mus=[...new Set(all.map(x=>x.primary_muscle).filter(Boolean))].sort(),eq=[...new Set(all.map(x=>x.equipment).filter(Boolean))].sort();$('#content').innerHTML=`<div class="ey">BIBLIOTECA</div><h1 class="title">47 ejercicios</h1><div class="filters"><input id="q" class="input" placeholder="Buscar ejercicio…"><select id="mus" class="input"><option value="">Todos los músculos</option>${mus.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="eq" class="input"><option value="">Todo el equipo</option>${eq.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="lib" class="lib"></div>`;let draw=()=>{$('#lib').innerHTML=all.filter(x=>(!$('#q').value||(`${x.name} ${x.primary_muscle||''}`).toLowerCase().includes($('#q').value.toLowerCase()))&&(!$('#mus').value||x.primary_muscle===$('#mus').value)&&(!$('#eq').value||x.equipment===$('#eq').value)).map(x=>`<div class="card ex">${x.image_path?`<img src="${esc(x.image_path)}" loading="lazy">`:''}<div class="p"><b>${esc(x.name)}</b><div class="muted" style="margin:6px 0">${esc(x.instructions||'Técnica pendiente')}</div><div>${pill(x.difficulty)} <span class="pill blue">${esc(x.primary_muscle||'General')}</span></div><div class="muted" style="margin-top:6px">${esc(x.equipment||'')} · Tempo ${esc(x.default_tempo||'—')} · ${x.default_rest_sec||0}s</div></div></div>`).join('')};['q','mus','eq'].forEach(id=>$('#'+id).oninput=draw);draw()}function account(){$('#content').innerHTML=`<div class="ey">CUENTA</div><h1 class="title">${esc((me.first_name||'Coach')+' '+(me.last_name||''))}</h1><div class="card"><b>Rol: ${esc(me.role)}</b><div class="muted">Panel conectado directamente a Supabase sin dependencias CDN de JavaScript.</div></div>`}function newClient(){$('#modal').innerHTML=`<div class="modal"><div class="card"><div class="row"><div class="grow"><div class="ey">ALTA DE CLIENTE</div><h2>Crear acceso</h2></div><button id="close" class="btn small">✕</button></div><input id="nf" class="input" placeholder="Nombre"><input id="nl" class="input" placeholder="Apellido"><input id="ne" class="input" type="email" placeholder
