/div><div class="metrics"><div class="metric"><span>CV Score</span><b>${cv?.current_cv_score==null?'—':Math.round(cv.current_cv_score)}</b></div><div class="metric"><span>Nivel</span><b>${cv?.current_level||1}</b></div><div class="metric"><span>XP</span><b>${cv?.total_xp||0}</b></div><div class="metric"><span>Programa</span><b style="font-size:11px">${esc(pr?.name||'Sin programa')}</b></div></div></div>`}).join('')}</div></div><div><h2>Alertas recientes</h2><div class="stack">${d.alerts.filter(x=>x.status!=='resolved').slice(0,8).map(a=>`<div class="card"><div class="row"><div class="grow"><b>${esc(a.title)}</b><div class="muted">${esc(a.message||'')}</div></div>${pill(a.severity)}</div></div>`).join('')||'<div class="card muted">Sin alertas abiertas.</div>'}</div></div></div>`;$('#newClient').onclick=newClient;$$('.clientOpen').forEach(x=>x.onclick=()=>clientDetail(x.dataset.id));$$('.attentionOpen').forEach(x=>x.onclick=()=>clientDetail(x.dataset.id))}async function clients(){let d=await core();$('#content').innerHTML=`<div class="head"><div><div class="ey">CLIENTES</div><h1 class="title">Gestión de clientes</h1></div><button id="newClient" class="btn primary">+ NUEVO CLIENTE</button></div><input id="search" class="input" placeholder="Buscar cliente…" style="max-width:360px"><div id="clientGrid" class="clients"></div>`;let draw=()=>{$('#clientGrid').innerHTML=d.profiles.filter(p=>cname(p).toLowerCase().includes($('#search').value.toLowerCase())).map(p=>{let cp=d.cp.find(x=>x.client_id===p.id),cv=d.cv.find(x=>x.client_id===p.id),pr=d.programs.find(x=>x.client_id===p.id&&x.status==='active');return `<div class="card client clientOpen" data-id="${p.id}"><div class="row"><div class="grow"><b>${esc(cname(p))}</b><div class="muted">${esc(cp?.primary_goal||'Sin objetivo')}</div></div>${pill(cp?.onboarding_status)}</div><div class="metrics"><div class="metric"><span>CV Score</span><b>${cv?.current_cv_score==null?'—':Math.round(cv.current_cv_score)}</b></div><div class="me erHTML=`<div class="ey">CUENTA</div><h1 class="title">${esc((me.first_name||'Coach')+' '+(me.last_name||''))}</h1><div class="card"><b>Rol: ${esc(me.role)}</b><div class="muted">Panel conectado directamente a Supabase sin dependencias CDN de JavaScript.</div></div>`}function newClient(){$('#modal').innerHTML=`<div class="modal"><div class="card"><div class="row"><div class="grow"><div class="ey">ALTA DE CLIENTE</div><h2>Crear acceso</h2></div><button id="close" class="btn small">✕</button></div><input id="nf" class="input" placeholder="Nombre"><input id="nl" class="input" placeholder="Apellido"><input id="ne" class="input" type="email" placeholder="Correo"><input id="np" class="input" placeholder="Teléfono"><button id="create" class="btn primary" style="width:100%">CREAR CLIENTE Y ENLACE</button><div id="nr" class="status muted"></div></div></div>`;$('#close').onclick=()=>$('#modal').innerHTML='';$('#create').onclick=async()=>{let r=$('#nr');try{r.textContent='Creando…';let d=await req('/functions/v1/provision-client',{method:'POST',body:JSON.stringify({email:$('#ne').value.trim(),first_name:$('#nf').value.trim(),last_name:$('#nl').value.trim(),phone:$('#np').value.trim()||null,client_url:'https://cv-coach-sodcloud-1237.vercel.app'})});r.innerHTML='<span style="color:#8be7ae">Cliente creado.</span><div style="word-break:break-all;margin-top:8px">'+esc(d.setup_link||'')+'</div>';cache={}}catch(e){r.style.color='#ff93a1';r.textContent=e.message}}}$('#loginBtn').onclick=login;$('#pass').onkeydown=e=>{if(e.key==='Enter')login()};$('#logout').onclick=()=>{localStorage.removeItem('cv_admin_session');location.reload()};$('#refresh').onclick=()=>{cache={};render()};$$('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));(async()=>{try{sess=JSON.parse(localStorage.getItem('cv_admin_session')||'null');if(sess){await enter()}}catch(e){localStorage.removeItem('cv_admin_session');sess=null;$('#status').style.color='#ff93a1';$('#status').textContent='Sesión anterior invá
