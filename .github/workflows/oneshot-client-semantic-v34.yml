name: CV Coach Client Semantic V34

on:
  push:
    branches:
      - fix/client-semantic-v34
    paths:
      - .github/workflows/oneshot-client-semantic-v34.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/client-semantic-v34
          fetch-depth: 0

      - name: Apply final client semantic cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client-portal/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'cv-client-semantic-v34'
          if marker not in text:
              css = r'''
          <style id="cv-client-semantic-v34">
          /* Final semantic cleanup confirmed from visual QA.
             Blue = information/current/time. Green = completed/success. Red = destructive/error only. */
          body.cvFastWorkout .cvWorkoutHeroEy{color:var(--cv-info)!important}
          body.cvFastWorkout .cvWorkoutHeroV31{
            background:radial-gradient(circle at 92% 18%,rgba(67,184,255,.11),transparent 31%),linear-gradient(135deg,#111920 0%,#090f14 58%,#070b0f 100%)!important;
          }
          body.cvFastWorkout .cvWorkoutHeroV31:before{
            background:linear-gradient(180deg,#65c8ff,#249fe8)!important;
            box-shadow:0 0 22px rgba(67,184,255,.30)!important;
          }
          body.cvFastWorkout button.btn.primary[onclick*="finishWorkout"],
          body.cvFastWorkout #cvFeedbackFinish{
            background:linear-gradient(180deg,#f1283c,#d91831)!important;
            border-color:#f13b4d!important;
            box-shadow:0 10px 28px rgba(225,29,46,.22)!important;
          }
          /* v32 is the canonical visible countdown; keep the legacy dock functional but invisible. */
          body.cvFastWorkout .cvRestDock{display:none!important}
          </style>
          '''
              if '</body>' not in text:
                  raise SystemExit('missing </body> in client portal')
              text = text.replace('</body>', css + '\n</body>', 1)

          text = text.replace(
              "try{document.querySelector('#cvRestDock .cvRestPlus')?.click()}catch(_){}",
              "try{[...document.querySelectorAll('#cvRestDock button')].find(b=>b.textContent.includes('+15'))?.click()}catch(_){}"
          )
          text = text.replace(
              "try{document.querySelector('#cvRestDock .cvRestSkip')?.click()}catch(_){}",
              "try{[...document.querySelectorAll('#cvRestDock button')].find(b=>/OMITIR/i.test(b.textContent))?.click()}catch(_){}"
          )
          path.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate-repo-contracts.py')
          v = validator.read_text(encoding='utf-8')
          line = 'require(client, "cv-client-semantic-v34", "client final semantic cleanup")'
          if line not in v:
              v += '\n' + line + '\n'
          validator.write_text(v, encoding='utf-8')
          PY

      - name: Validate repository contracts
        run: python scripts/validate-repo-contracts.py

      - name: Validate diff
        run: git diff --check

      - name: Commit canonical change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "CV Coach Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-client-semantic-v34.yml
          git add client-portal/index.html scripts/validate-repo-contracts.py
          git commit -m "fix(client): finish semantic color cleanup"
          git push origin HEAD:fix/client-semantic-v34
