name: V80 Client Image Fallback — ONE SHOT

on:
  push:
    branches:
      - fix/v80-client-external-image-fallback
    paths:
      - '.github/workflows/v80-client-image-fallback-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v80-client-external-image-fallback
          fetch-depth: 0

      - name: Patch image fallback and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          target = Path('client-portal/index.html')
          text = target.read_text(encoding='utf-8')
          old = "function cvImage(name){return CV_BASE+(CV_FILES[cvNorm(name)]||'')}"
          new = "function cvImage(name){const file=CV_FILES[cvNorm(name)]||'';return file?CV_BASE+file:''}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one cvImage legacy definition, found {count}')
          target.write_text(text.replace(old,new), encoding='utf-8')
          Path('.github/workflows/v80-client-image-fallback-one-shot.yml').unlink()

      - name: Commit deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CV Coach Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-portal/index.html .github/workflows/v80-client-image-fallback-one-shot.yml
          git commit -m "fix(client): use exercise image_path when legacy map has no image"
          git push origin HEAD:fix/v80-client-external-image-fallback
