name: Validate F1.M1.S5 Rank Engine Cutover

on:
  pull_request:
    paths:
      - "supabase/migrations/202609182300_f1_m1_s5_rank_engine_cutover_arch1.sql"
      - "scripts/test-f1-m1-s5-rank-engine-cutover.py"
      - ".github/workflows/validate-f1-m1-s5-rank-engine-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-engine-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-rank-engine-cutover.py
