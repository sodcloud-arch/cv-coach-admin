name: CV Coach Fix AI Review Explanation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-fix-ai-review-explanation-v1.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-ai-review-explanation-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_fkeoRxjDY3ZDQlIadS1EaIowFi87
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - uses: actions/checkout@v4

      - name: Correct AI review explanation binding
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "+aiReviewExplanations(generation)+(generation?.id?"
          new = "+aiReviewExplanations(generation.explanations)+(generation?.id?"
          if old not in text:
              raise SystemExit('AI review explanation anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate source
        run: |
          set -euo pipefail
          grep -Fq 'aiReviewExplanations(generation.explanations)' index.html
          if grep -Fq 'aiReviewExplanations(generation)+(generation?.id?' index.html; then
            echo 'Old AI review explanation binding still present' >&2
            exit 1
          fi
          grep -Fq 'openAiGenerationComparison' index.html
          grep -Fq 'Rutina anterior vs nueva rutina' index.html
          grep -Fq 'VER CAMBIOS' index.html
          python scripts/validate-repo-contracts.py
          git diff --check

      - name: Commit canonical fix and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/oneshot-fix-ai-review-explanation-v1.yml
          git commit -m 'fix(admin): restore persisted AI review explanation'
          git push origin HEAD:main

      - name: Deploy Admin production
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify public production
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl -fsSL --max-time 20 https://cv-coach-admin.vercel.app || true)"
            if [[ "$body" == *'aiReviewExplanations(generation.explanations)'* && "$body" == *'openAiGenerationComparison'* && "$body" == *'VER CAMBIOS'* ]]; then
              echo 'PUBLIC_AI_REVIEW_COMPARISON_OK'
              exit 0
            fi
            sleep 3
          done
          echo 'Production verification failed' >&2
          exit 1
