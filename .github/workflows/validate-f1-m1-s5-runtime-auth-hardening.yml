name: Validate F1.M1.S5 Runtime Auth Hardening

on:
  pull_request:
    paths:
      - "supabase/migrations/202609182430_f1_m1_s5_runtime_auth_hardening_arch1.sql"
      - "scripts/test-f1-m1-s5-runtime-auth-hardening.py"
      - ".github/workflows/validate-f1-m1-s5-runtime-auth-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-auth-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-runtime-auth-hardening.py
