name: CV Coach V92 CV12 Admin Operations Contracts

on:
  push:
    paths:
      - 'supabase/migrations/202609141435_cv12_cutover_admin_v92.sql'
      - 'admin-assets/cv12-cutover-admin-v92.js'
      - 'admin-assets/v78-library.js'
      - 'admin-assets/v78-library-original.js'
      - '.github/workflows/validate-v92-cv12-admin-operations.yml'
  pull_request:
    paths:
      - 'supabase/migrations/202609141435_cv12_cutover_admin_v92.sql'
      - 'admin-assets/cv12-cutover-admin-v92.js'
      - 'admin-assets/v78-library.js'
      - 'admin-assets/v78-library-original.js'
      - '.github/workflows/validate-v92-cv12-admin-operations.yml'

jobs:
  validate-v92:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V92 frontend and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          sql='supabase/migrations/202609141435_cv12_cutover_admin_v92.sql'
          ui='admin-assets/cv12-cutover-admin-v92.js'
          bootstrap='admin-assets/v78-library.js'
          original='admin-assets/v78-library-original.js'
          test -f "$sql"
          test -f "$ui"
          test -f "$bootstrap"
          test -f "$original"
          node --check "$ui"
          node --check "$bootstrap"
          node --check "$original"
          grep -q 'get_cv12_cutover_audit_v92' "$sql"
          grep -q 'CV12_CUTOVER_ADMIN_V92' "$sql"
          grep -q 'mutations_via_v90_only' "$sql"
          grep -q 'get_cv12_cutover_control_v91' "$ui"
          grep -q 'resolve_cv12_native_client_v91' "$ui"
          grep -q 'execute_cv12_native_cutover_v90' "$ui"
          grep -q 'rollback_cv12_native_cutover_v90' "$ui"
          grep -q "word: 'VINCULAR'" "$ui"
          grep -q "word: 'DESVINCULAR'" "$ui"
          grep -q '/admin-assets/v78-library-original.js' "$bootstrap"
          grep -q '/admin-assets/cv12-cutover-admin-v92.js' "$bootstrap"
          grep -q 'Exercise Library Control Center' "$original"
          grep -q 'window.library' "$original"
          if grep -Eq 'insert into public\.workout_sessions|insert into public\.programs|delete from public\.legacy_cv12' "$sql" "$ui"; then
            echo 'V92 must not create native training data or delete legacy history' >&2
            exit 1
          fi
          if grep -q '/functions/v1/provision-client' "$ui"; then
            echo 'V92 must reuse the existing client creation UI instead of auto-provisioning identities' >&2
            exit 1
          fi
