name: CV Coach Hard Schedule Constraints V1

on:
  push:
    branches:
      - feature/hard-schedule-constraints-v1
    paths:
      - '.github/workflows/oneshot-hard-schedule-constraints-v1.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-hard-schedule-constraints-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hard-schedule-constraints-v1

      - name: Apply hard schedule constraints
        run: |
          set -euo pipefail
          python scripts/oneshot-hard-schedule-constraints-v1.py

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'cv-schedule-audit-v1' supabase/functions/generate-ai-program/index.ts
          grep -q 'buildScheduleAudit' supabase/functions/generate-ai-program/index.ts
          grep -q 'session_duration_minutes' supabase/functions/generate-ai-program/index.ts
          grep -q 'weekly_availability' supabase/functions/generate-ai-program/index.ts
          grep -q 'AUDITOR DE TIEMPO Y FRECUENCIA' index.html
          grep -q 'aiScheduleAuditHtml' index.html
          git diff --check

      - name: Commit canonical change and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase/functions/generate-ai-program/index.ts scripts/validate-repo-contracts.py
          git rm -f scripts/oneshot-hard-schedule-constraints-v1.py .github/workflows/oneshot-hard-schedule-constraints-v1.yml
          git commit -m 'feat(ai): enforce client schedule and session time'
          git push origin HEAD:feature/hard-schedule-constraints-v1
