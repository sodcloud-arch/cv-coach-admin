name: Install Retention V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-retention-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Retention V1 patch
        run: python3 scripts/install-retention-v1.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re
          text=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-admin-retention-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-admin-retention-inline.js

      - name: Validate Retention V1 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          required=[
            'data-v="retention"',
            "retention:'Retención'",
            "if(view==='retention')await retention();",
            'async function retention()',
            'attentionQueueLastError',
            "retentionOptional('client_subscriptions'",
            "retentionOptional('subscription_billing_records'",
            "retentionOptional('plans'",
            'Riesgo autoritativo',
            'Prioridad del motor',
            'Señal separada del riesgo',
            'COPIAR SEGUIMIENTO',
            'navigator.clipboard.writeText',
            "timeZone:'America/Santiago'",
            "setView('reports')",
            'clientDetail(button.dataset.id)'
          ]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing Retention markers: '+', '.join(missing))
          start=text.index('function retentionMoney')
          end=text.index('function subscriptionBlockHtml',start)
          block=text[start:end]
          forbidden=[
            "method:'PATCH'", 'method:"PATCH"',
            "method:'DELETE'", 'method:"DELETE"',
            "method:'PUT'", 'method:"PUT"',
            '/functions/v1/',
            'manage-billing', 'manage-subscription', 'manage-plan',
            'churn score', 'probabilidad de baja',
            'service_role', 'OPENAI_API_KEY'
          ]
          found=[x for x in forbidden if x in block]
          if found:
              raise SystemExit('Retention must remain read-only and authoritative; found: '+', '.join(found))
          if 'toISOString().slice(0,10)' in block or 'toISOString().slice(0, 10)' in block:
              raise SystemExit('Retention must not use UTC ISO date as Chile local day')
          if "status==='overdue'" not in block or "status==='pending'" not in block:
              raise SystemExit('Persisted pending/overdue billing states are not used explicitly')
          if 'attention_score' not in block or 'risk_score' not in block or 'next_action' not in block:
              raise SystemExit('Authoritative attention queue fields missing')
          PY
          git diff --check

      - name: Commit validated Retention V1 and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-retention-v1.py .github/workflows/install-retention-v1.yml
          git add index.html
          git commit -m "feat(admin): add Retention V1"
          git push origin HEAD:main

      - name: Dispatch canonical Admin production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-admin-production.yml --ref main
