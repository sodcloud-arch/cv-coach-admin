name: One-shot client header isotipo V39

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-client-header-isotipo-v39.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add optimized isotipo asset
        shell: bash
        run: |
          mkdir -p client-portal/assets
          echo '' | base64 -d > client-portal/assets/cv-isotipo-header-v1.webp

      - name: Replace V38 header with isotipo V39
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('client-portal/index.html')
          s = p.read_text(encoding='utf-8')

          block = r'''<style id="cv-client-header-v39">
          /* CV Coach · Mobile Header V39 · isotipo oficial + una sola fila real */
          @media(max-width:699px){
            .top{
              height:calc(70px + env(safe-area-inset-top))!important;
              min-height:calc(70px + env(safe-area-inset-top))!important;
              padding:max(env(safe-area-inset-top),6px) 10px 6px!important;
              display:grid!important;
              grid-template-columns:72px minmax(0,1fr) 92px!important;
              grid-template-rows:1fr!important;
              gap:6px!important;
              align-items:center!important;
              background:linear-gradient(180deg,rgba(2,6,8,.995),rgba(4,9,12,.985))!important;
              border-bottom:1px solid #25333b!important;
              box-shadow:0 10px 28px rgba(0,0,0,.42)!important;
              overflow:hidden!important;
            }
            .top .cvOfficialHeaderImg{
              display:block!important;
              grid-column:1!important;
              grid-row:1!important;
              justify-self:start!important;
              width:64px!important;
              height:64px!important;
              max-width:64px!important;
              max-height:64px!important;
              margin:0!important;
              object-fit:contain!important;
              object-position:left center!important;
              filter:drop-shadow(0 5px 12px rgba(0,0,0,.58)) drop-shadow(0 0 12px rgba(225,29,46,.20))!important;
            }
            .top .topTitle,.top .cvHeaderIdentity{
              grid-column:2!important;
              grid-row:1!important;
              justify-self:center!important;
              align-self:center!important;
              display:flex!important;
              flex-direction:row!important;
              align-items:center!important;
              justify-content:center!important;
              width:100%!important;
              min-width:0!important;
              margin:0!important;
              padding:0!important;
              text-align:center!important;
              white-space:nowrap!important;
            }
            .top .cvHeaderIdentity b,.top .topTitle b{
              display:block!important;
              margin:0!important;
              font:800 19px 'Barlow Condensed',sans-serif!important;
              line-height:1!important;
              letter-spacing:.055em!important;
              color:#fff!important;
              white-space:nowrap!important;
            }
            .top .cvHeaderIdentity small,.top .topTitle small{display:none!important}
            .topRight{
              grid-column:3!important;
              grid-row:1!important;
              justify-self:end!important;
              align-self:center!important;
              display:flex!important;
              align-items:center!important;
              justify-content:flex-end!important;
              width:92px!important;
              min-width:92px!important;
              gap:6px!important;
              margin:0!important;
              padding:0!important;
            }
            .demoBadge,.cvNotificationButton,#cvNotificationButton{display:none!important}
            #cvSoundToggle,.cvSoundToggle{
              width:38px!important;
              min-width:38px!important;
              height:38px!important;
              min-height:38px!important;
              padding:0!important;
              border-radius:11px!important;
            }
            .logout{
              height:38px!important;
              min-height:38px!important;
              min-width:48px!important;
              padding:0 8px!important;
              border-radius:11px!important;
              font-size:11px!important;
              font-weight:800!important;
              white-space:nowrap!important;
            }
            .workoutTop{top:calc(70px + env(safe-area-inset-top))!important}
          }
          @media(max-width:390px){
            .top{grid-template-columns:68px minmax(0,1fr) 88px!important;padding-left:8px!important;padding-right:8px!important;gap:4px!important}
            .top .cvOfficialHeaderImg{width:60px!important;height:60px!important;max-width:60px!important;max-height:60px!important}
            .top .cvHeaderIdentity b,.top .topTitle b{font-size:18px!important;letter-spacing:.045em!important}
            .topRight{width:88px!important;min-width:88px!important;gap:4px!important}
            #cvSoundToggle,.cvSoundToggle{width:36px!important;min-width:36px!important;height:36px!important;min-height:36px!important}
            .logout{height:36px!important;min-height:36px!important;min-width:48px!important;padding:0 7px!important;font-size:10px!important}
          }
          </style>
          <script id="cv-client-header-v39-js">
          (function(){
            const ASSET='./assets/cv-isotipo-header-v1.webp';
            function applyHeaderV39(){
              if(!window.matchMedia || !window.matchMedia('(max-width:699px)').matches)return;
              const top=document.querySelector('.top');
              if(!top)return;
              let img=top.querySelector('.cvOfficialHeaderImg');
              if(img && img.getAttribute('src')!==ASSET){
                img.src=ASSET;
                img.alt='CV Coach';
                img.setAttribute('aria-label','CV Coach');
              }
              const title=top.querySelector('.topTitle,.cvHeaderIdentity');
              if(title && (title.textContent.trim()!=='RUTINA' || title.querySelector('small'))){
                title.classList.add('cvHeaderIdentity');
                title.innerHTML='<b>RUTINA</b>';
              }
              top.querySelectorAll('.demoBadge,.cvNotificationButton,#cvNotificationButton').forEach(el=>el.remove());
            }
            function boot(){
              applyHeaderV39();
              const top=document.querySelector('.top');
              if(top){
                let queued=false;
                new MutationObserver(()=>{
                  if(queued)return;
                  queued=true;
                  requestAnimationFrame(()=>{queued=false;applyHeaderV39()});
                }).observe(top,{childList:true,subtree:true,attributes:true,attributeFilter:['src','class']});
              }
              window.addEventListener('resize',applyHeaderV39,{passive:true});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          })();
          </script>'''

          pattern = re.compile(r'<style id="cv-client-header-v38">.*?</style>\s*<script id="cv-client-header-v38-js">.*?</script>', re.S)
          if pattern.search(s):
              s = pattern.sub(block, s, count=1)
          elif 'cv-client-header-v39' not in s:
              s = s.replace('</body>', block + '\n</body>')
          else:
              raise SystemExit('V39 already present; refusing duplicate patch')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          test -s client-portal/assets/cv-isotipo-header-v1.webp
          grep -q 'cv-client-header-v39' client-portal/index.html
          grep -q "cv-isotipo-header-v1.webp" client-portal/index.html
          ! grep -q 'cv-client-header-v38' client-portal/index.html
          git diff --check

      - name: Commit canonical change and self-delete workflow
        shell: bash
        run: |
          rm -f .github/workflows/oneshot-client-header-isotipo-v39.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(client): use CV isotipo in compact mobile header v39'
          git push origin HEAD:main
