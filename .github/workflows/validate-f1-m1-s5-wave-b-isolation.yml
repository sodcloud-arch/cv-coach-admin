name: Validate F1.M1.S5 Wave B Isolation

on:
  pull_request:
    paths:
      - "supabase/migrations/202609181600_f1_m1_s5_tenant_uniqueness_hardening_arch1.sql"
      - "supabase/migrations/202609181620_f1_m1_s5_derived_records_isolation_arch1.sql"
      - "scripts/test-f1-m1-s5-wave-b-isolation.py"
      - ".github/workflows/validate-f1-m1-s5-wave-b-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave-b-isolation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate F1.M1.S5 Wave B isolation contract
        run: python scripts/test-f1-m1-s5-wave-b-isolation.py
