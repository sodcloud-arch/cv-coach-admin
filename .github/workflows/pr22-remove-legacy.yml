name: CV Coach PR22 Remove Legacy Editor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr22-remove-legacy.yml"

permissions:
  contents: write

jobs:
  cleanup-pr22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unused legacy editor and validate PR22
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='autopilot/84b56d41-program_exercise_builder_ui'
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start='async function legacyProgramEditor(id)'
          end='function exerciseValue(id)'
          if s.count(start)!=1:
              raise SystemExit(f'expected exactly one legacyProgramEditor, found {s.count(start)}')
          if s.count(end)!=1:
              raise SystemExit(f'expected exactly one exerciseValue marker, found {s.count(end)}')
          a=s.index(start)
          b=s.index(end,a)
          s=s[:a]+s[b:]
          if 'legacyProgramEditor' in s:
              raise SystemExit('legacyProgramEditor reference remains after cleanup')
          p.write_text(s)
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/pr22.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/pr22.js
          unexpected="$(git diff --name-only "$(git merge-base origin/main HEAD)" -- | grep -v '^index\.html$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected changed files: ${unexpected}" >&2
            exit 1
          fi
          git add index.html
          git commit -m "autopilot: remove unused legacy program editor"
          git push origin "HEAD:${BRANCH}"
