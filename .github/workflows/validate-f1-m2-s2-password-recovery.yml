name: Validate F1.M2.S2 Password Recovery

on:
  pull_request:
    paths:
      - "admin-assets/password-recovery-v1.js"
      - "index.html"
      - "client-portal/index.html"
      - "scripts/test-f1-m2-s2-password-recovery.py"
      - ".github/workflows/validate-f1-m2-s2-password-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m2-s2-password-recovery.py
