name: V80 Canary Feedback Patch — ONE SHOT

on:
  push:
    branches: [fix/v80-canary-v48-feedback]
    paths:
      - '.github/workflows/v80-feedback-canary-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v80-canary-v48-feedback

      - name: Patch V48 feedback selectors in canary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-production-canary-v76.mjs')
          t=p.read_text(encoding='utf-8')
          old="""  await page.locator('#cvFeedbackFinish').waitFor({state:'visible',timeout:10000});
  await page.locator('#cvFeedbackEffort').evaluate(el=>{el.value='6';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))});
  await page.locator('#cvFeedbackFatigue').evaluate(el=>{el.value='3';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))});
  await page.locator('#cvFeedbackPain').evaluate(el=>{el.value='0';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))});
  await page.locator('#cvFeedbackNotes').fill(`CV_CANARY_V76 run=${RUN_ID}`);
  await tap(page,page.locator('#cvFeedbackFinish'),'submit-feedback');
"""
          new="""  await page.locator('#cvFeedbackFinish').waitFor({state:'visible',timeout:10000});
  await tap(page,page.locator('#cvFeedbackDifficulty button[data-level=\"3\"]'),'feedback-difficulty-3');
  await tap(page,page.locator('#cvFeedbackPainChoice button[data-pain=\"0\"]'),'feedback-pain-no');
  await page.locator('#cvFeedbackNotes').fill(`CV_CANARY_V76 run=${RUN_ID}`);
  await tap(page,page.locator('#cvFeedbackFinish'),'submit-feedback');
"""
          if old not in t:
              raise SystemExit('legacy feedback block not found')
          if new in t:
              raise SystemExit('new feedback block already present')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-production-canary-v76.mjs
          git rm .github/workflows/v80-feedback-canary-one-shot.yml
          git commit -m 'fix(v80): align canary with V48 workout feedback'
          git push origin HEAD:fix/v80-canary-v48-feedback
