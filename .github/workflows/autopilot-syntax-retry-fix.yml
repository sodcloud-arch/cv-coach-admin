name: Autopilot Syntax Retry Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autopilot-syntax-retry-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden patch formatting and syntax failure recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/autopilot-external-executor.sh')
          s=p.read_text()
          old="Do not claim tests ran; the deterministic runner performs validation after your proposal.'"
          new="When new_text contains multiline source code, encode line breaks as JSON newline escapes that decode to real newline characters; never emit literal backslash+n sequences between JavaScript statements. Do not claim tests ran; the deterministic runner performs validation after your proposal.'"
          if old not in s:
              raise SystemExit('system instruction anchor not found')
          s=s.replace(old,new,1)
          old2='''    node --check /tmp/cv-autopilot-inline.js
    git diff --check -- "${TARGET_PATH}"'''
          new2='''    if ! node --check /tmp/cv-autopilot-inline.js; then
      mv "${TARGET_PATH}.autopilot-backup" "${TARGET_PATH}"
      external_retry "${request_id}" "Patch rejected by JavaScript syntax validation; regenerate using real newline characters rather than literal backslash-n separators." 5
      echo "Autopilot external executor: RETRY (javascript syntax)"
      exit 0
    fi
    if ! git diff --check -- "${TARGET_PATH}"; then
      mv "${TARGET_PATH}.autopilot-backup" "${TARGET_PATH}"
      external_retry "${request_id}" "Patch rejected by git diff validation" 5
      echo "Autopilot external executor: RETRY (diff check)"
      exit 0
    fi'''
          if old2 not in s:
              raise SystemExit('validation anchor not found')
          p.write_text(s.replace(old2,new2,1))
          PY
          bash -n scripts/autopilot-external-executor.sh
          git diff --check
          grep -q 'RETRY (javascript syntax)' scripts/autopilot-external-executor.sh
          grep -q 'never emit literal backslash+n' scripts/autopilot-external-executor.sh
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cv-coach-autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/autopilot-syntax-retry-fix.yml
          git add scripts/autopilot-external-executor.sh
          git commit -m 'fix(autopilot): retry invalid AI patches safely'
          git push origin HEAD:main
