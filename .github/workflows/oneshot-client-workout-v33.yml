name: CV Coach Client Workout V33

on:
  push:
    branches:
      - fix/client-workout-interaction-v33
    paths:
      - '.github/workflows/oneshot-client-workout-v33.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-client-workout-v33
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-workout-interaction-v33

      - name: Apply client workout v33 repair
        run: |
          set -euo pipefail
          python scripts/oneshot-client-workout-v33.py

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'window.cvExercises=cvExercises' client-portal/index.html
          grep -q 'cv-client-semantic-v33' client-portal/index.html
          grep -q 'cvRestVisualV32' client-portal/index.html
          ! grep -q 'window.workout?.dayId' client-portal/index.html
          ! grep -q 'window.data?.days' client-portal/index.html
          git diff --check

      - name: Validate inline JavaScript syntax
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('client-portal/index.html','utf8');
          const re=/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi;
          let m,n=0;
          while((m=re.exec(html))){n++;new Function(m[1]);}
          if(n<5) throw new Error('Unexpected inline script count: '+n);
          console.log('INLINE_JS_SYNTAX_OK',n);
          NODE

      - name: Commit canonical fix and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-portal/index.html scripts/validate-repo-contracts.py
          git rm -f scripts/oneshot-client-workout-v33.py .github/workflows/oneshot-client-workout-v33.yml
          git commit -m 'fix(client): repair set completion and semantic palette'
          git push origin HEAD:fix/client-workout-interaction-v33
