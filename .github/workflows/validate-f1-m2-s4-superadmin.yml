name: Validate F1.M2.S4 SuperAdmin

on:
  pull_request:
    paths:
      - "supabase/migrations/202609190500_f1_m2_s4_platform_superadmin_support_context.sql"
      - "scripts/test-f1-m2-s4-superadmin.py"
      - ".github/workflows/validate-f1-m2-s4-superadmin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superadmin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m2-s4-superadmin.py
