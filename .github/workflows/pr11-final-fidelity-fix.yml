name: CV Coach PR11 Final Fidelity Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr11-final-fidelity-fix.yml"

permissions:
  contents: write

jobs:
  patch-pr11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='autopilot/2969ce11-client_progression_review_ui'
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="ex?.name||s.exercise_name||'Ejercicio'"
          new="ex?.name||s.exercise_name||'Nombre no disponible'"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 fallback occurrence, found {count}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/pr11-final.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/pr11-final.js
          git add index.html
          git commit -m "autopilot: avoid invented exercise fallback label"
          git push origin "HEAD:${BRANCH}"
