name: CV Coach V78 One-Shot Index Patch

on:
  push:
    branches:
      - feature/v78-exercise-library-control-center
    paths:
      - .github/scripts/v78-patch-index.py

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v78-exercise-library-control-center
      - name: Patch index safely
        run: python .github/scripts/v78-patch-index.py
      - name: Commit generated index change
        run: |
          if git diff --quiet -- index.html; then
            echo "Index already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CV Coach V78: cargar módulo Exercise Library Control Center"
          git push origin HEAD:feature/v78-exercise-library-control-center
