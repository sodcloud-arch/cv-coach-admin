name: Validate F1.M1.S5 AI Context Tenant Hotfix

on:
  pull_request:
    paths:
      - "supabase/migrations/202609182700_f1_m1_s5_ai_context_scope_hotfix_arch1.sql"
      - "scripts/test-f1-m1-s5-ai-context-scope-hotfix.py"
      - ".github/workflows/validate-f1-m1-s5-ai-context-scope-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-context-tenant-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-ai-context-scope-hotfix.py
