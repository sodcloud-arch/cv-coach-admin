name: CV Coach V103 Exercise Details Production

on:
  workflow_run:
    workflows: ['CV Coach Client Production Deploy']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cv-coach-v103-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-v103:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_PmFZQqN9tVEAUgKH8ekcnOoSgNOL
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - name: Checkout deployed main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build canonical client through V103
        shell: bash
        run: |
          set -euo pipefail
          python client-portal/stabilize.py
          python client-portal/consolidate_runtime.py
          python client-portal/consolidate_session_runtime.py
          python client-portal/workout_feedback.py
          python client-portal/upgrade_feedback_v48.py
          python client-portal/upgrade_client_v49.py
          python client-portal/upgrade_client_v50.py
          python client-portal/upgrade_client_v51.py
          python client-portal/upgrade_client_v52.py
          python client-portal/upgrade_client_v53.py
          python client-portal/upgrade_client_v54.py
          python client-portal/upgrade_client_v55.py
          python client-portal/upgrade_client_v56.py
          python client-portal/upgrade_client_v57.py
          python client-portal/upgrade_client_v59.py
          python client-portal/upgrade_client_v60.py
          python client-portal/repair_client_v60.py
          python client-portal/upgrade_client_v61.py
          python client-portal/upgrade_client_v67.py
          python client-portal/upgrade_client_v68.py
          python client-portal/upgrade_client_v69.py
          python client-portal/upgrade_client_v74.py
          python client-portal/upgrade_client_v101.py
          python client-portal/upgrade_client_v102.py
          python client-portal/upgrade_client_v103.py
          node --check client-portal/assets/cv-exercise-details-v103.js
          grep -q 'CV_EXERCISE_SCREEN_V102_READY' client-portal/stable/index.html
          grep -q 'V102.2_SELF_CONTAINED_FOCUS' client-portal/stable/index.html
          grep -q 'CV_EXERCISE_DETAILS_V103_READY' client-portal/stable/index.html
          grep -q 'cvDetailsLinkV103' client-portal/stable/index.html
          grep -q 'get_exercise_technique_v103' client-portal/stable/index.html

      - name: Require Vercel credential
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_MISSING' >&2; exit 1; }

      - name: Create Vercel static Build Output
        working-directory: client-portal/stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static/assets/sounds .vercel/output/static/assets/ranks
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cp index.html .vercel/output/static/index.html
          cp ../manifest.webmanifest .vercel/output/static/manifest.webmanifest
          cp ../sw.js .vercel/output/static/sw.js
          cp ../icon.svg .vercel/output/static/icon.svg
          cp ../assets/cv-isotipo-header-v1.webp .vercel/output/static/assets/cv-isotipo-header-v1.webp
          cp ../assets/cv-rank-v61.js .vercel/output/static/assets/cv-rank-v61.js
          cp ../assets/cv-rank-v61.css .vercel/output/static/assets/cv-rank-v61.css
          cp ../assets/cv-push-v101.js .vercel/output/static/assets/cv-push-v101.js
          cp ../assets/sounds/*.mp3 .vercel/output/static/assets/sounds/
          cp ../assets/ranks/*.webp .vercel/output/static/assets/ranks/
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {"src":"/","dest":"/index.html","headers":{"Cache-Control":"no-store","Content-Security-Policy":"default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://fmhcansyxcsqkrivqchr.supabase.co wss://fmhcansyxcsqkrivqchr.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests","X-Content-Type-Options":"nosniff","X-Frame-Options":"DENY","Referrer-Policy":"strict-origin-when-cross-origin","Permissions-Policy":"camera=(), microphone=(), geolocation=()","X-Robots-Tag":"noindex, nofollow"}},
              {"src":"/sw.js","dest":"/sw.js","headers":{"Cache-Control":"no-cache, no-store, must-revalidate","Service-Worker-Allowed":"/","X-Content-Type-Options":"nosniff"}},
              {"src":"/manifest.webmanifest","dest":"/manifest.webmanifest","headers":{"Cache-Control":"no-cache","Content-Type":"application/manifest+json; charset=utf-8","X-Content-Type-Options":"nosniff"}},
              {"src":"/icon.svg","dest":"/icon.svg","headers":{"Cache-Control":"public, max-age=3600","Content-Type":"image/svg+xml; charset=utf-8","X-Content-Type-Options":"nosniff"}},
              {"src":"/assets/(.*)","dest":"/assets/$1","headers":{"Cache-Control":"public, max-age=3600","X-Content-Type-Options":"nosniff"}},
              {"handle":"filesystem"},
              {"src":"/(.*)","dest":"/index.html","headers":{"Cache-Control":"no-store","Content-Security-Policy":"default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://fmhcansyxcsqkrivqchr.supabase.co wss://fmhcansyxcsqkrivqchr.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests","X-Content-Type-Options":"nosniff","X-Frame-Options":"DENY","Referrer-Policy":"strict-origin-when-cross-origin","Permissions-Policy":"camera=(), microphone=(), geolocation=()","X-Robots-Tag":"noindex, nofollow"}}
            ]
          }
          JSON
          test -s .vercel/output/static/index.html
          grep -q 'CV_EXERCISE_DETAILS_V103_READY' .vercel/output/static/index.html
          grep -q 'cvDetailsLinkV103' .vercel/output/static/index.html

      - name: Deploy V103 client production
        working-directory: client-portal/stable
        shell: bash
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Wait for canonical alias V103
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            body="$(curl --fail --silent --show-error --location --max-time 20 'https://cv-coach-roan.vercel.app/?v=103-canary' || true)"
            if [[ "$body" == *"CV_EXERCISE_DETAILS_V103_READY"* && "$body" == *"cvDetailsLinkV103"* && "$body" == *"V102.2_SELF_CONTAINED_FOCUS"* ]]; then
              echo 'PUBLIC_PORTAL_V103_STATIC_OK'
              exit 0
            fi
            sleep 3
          done
          echo 'V103 did not reach canonical alias' >&2
          exit 1

      - name: Install Playwright WebKit
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Run V103 live technique canary
        env:
          CV_TEST_URL: https://cv-coach-roan.vercel.app
        run: node scripts/test-exercise-details-v103-production.mjs

      - name: Production summary
        run: echo 'CV_EXERCISE_DETAILS_V103_PRODUCTION_OK'
