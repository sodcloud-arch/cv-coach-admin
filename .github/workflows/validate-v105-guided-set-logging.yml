name: Validate V105 Guided Set Logging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client-portal/**/*.py'
      - 'client-portal/assets/**'
      - 'scripts/build-client-canonical.sh'
      - 'scripts/test-guided-set-logging-v105-browser.mjs'
      - 'scripts/test-active-session-v105-browser.mjs'
      - '.github/workflows/validate-v105-guided-set-logging.yml'
  push:
    branches: [main, 'feat/v105-guided-set-logging']
    paths:
      - 'client-portal/**/*.py'
      - 'client-portal/assets/**'
      - 'scripts/build-client-canonical.sh'
      - 'scripts/test-guided-set-logging-v105-browser.mjs'
      - 'scripts/test-active-session-v105-browser.mjs'
      - '.github/workflows/validate-v105-guided-set-logging.yml'

permissions:
  contents: read

jobs:
  validate-v105:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build canonical client through V105
        run: bash scripts/build-client-canonical.sh

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Serve built client
        shell: bash
        run: |
          python3 -m http.server 4173 --directory client-portal/stable >/tmp/cv105-http.log 2>&1 &
          echo $! > /tmp/cv105-http.pid
          sleep 1

      - name: Execute V105 mobile behavior
        env:
          CV_TEST_URL: http://127.0.0.1:4173
        run: node scripts/test-guided-set-logging-v105-browser.mjs

      - name: Upload V105 mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v105-mobile-visual
          path: |
            artifacts/v105-mobile-current.png
            artifacts/v105-active-session/*.png
          if-no-files-found: warn
          retention-days: 3

  validate-active-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build canonical client through V105
        run: bash scripts/build-client-canonical.sh

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve built client
        shell: bash
        run: |
          python3 -m http.server 4174 --directory client-portal/stable >/tmp/cv105-active-http.log 2>&1 &
          echo $! > /tmp/cv105-active-http.pid
          sleep 1

      - name: Execute active workout mobile behavior
        env:
          CV_TEST_URL: http://127.0.0.1:4174
          CV_BROWSER: chromium
        run: node scripts/test-active-session-v105-browser.mjs

      - name: Upload active workout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v105-active-session-visual
          path: artifacts/v105-active-session/*.png
          if-no-files-found: warn
          retention-days: 3
