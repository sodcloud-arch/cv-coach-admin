name: CV Coach Current Training Schedule V1

on:
  push:
    branches:
      - feature/current-training-schedule-v1
    paths:
      - '.github/workflows/oneshot-current-training-schedule-v1.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-current-training-schedule-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/current-training-schedule-v1

      - name: Apply current schedule patch
        run: |
          set -euo pipefail
          python scripts/oneshot-current-training-schedule-v1.py

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'schedule_preferences' supabase/functions/generate-ai-program/index.ts
          grep -q 'Disponibilidad de entrenamiento' index.html
          grep -q 'set_client_training_schedule_backend' index.html
          git diff --check

      - name: Commit canonical change and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase/functions/generate-ai-program/index.ts scripts/validate-repo-contracts.py
          git rm -f scripts/oneshot-current-training-schedule-v1.py .github/workflows/oneshot-current-training-schedule-v1.yml
          git commit -m 'feat(training): add current schedule preferences'
          git push origin HEAD:feature/current-training-schedule-v1
