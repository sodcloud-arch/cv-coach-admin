name: Autopilot Review Queue Patch V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-autopilot-review-queue.py"
      - "scripts/patch-autopilot-readonly-sensitive.py"
      - "scripts/patch-autopilot-deploy-after-merge.py"
      - ".github/workflows/autopilot-review-queue-patch-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review queue recovery patch
        run: python3 scripts/patch-autopilot-review-queue.py
      - name: Refine read-only sensitive-context classification
        run: python3 scripts/patch-autopilot-readonly-sensitive.py
      - name: Wire production deployment after Autopilot merges
        run: python3 scripts/patch-autopilot-deploy-after-merge.py
      - name: Validate Autopilot self-review and worker
        run: |
          bash -n scripts/autopilot-self-review.sh
          git diff --check
          grep -q 'skipping stale/non-reviewable PR' scripts/autopilot-self-review.sh
          grep -q 'sensitive_scan_text=' scripts/autopilot-self-review.sh
          grep -q 'dispatch_production_deploy()' scripts/autopilot-self-review.sh
          grep -q 'actions: write' .github/workflows/cv-autopilot-worker.yml
      - name: Commit patch
        run: |
          git config user.name 'sodcloud-arch'
          git config user.email 'sodcloud@gmail.com'
          git add scripts/autopilot-self-review.sh .github/workflows/cv-autopilot-worker.yml
          if git diff --cached --quiet; then
            echo 'Autopilot runtime already up to date.'
            exit 0
          fi
          git commit -m 'fix: dispatch production deploy after Autopilot merges'
          git push origin HEAD:main
