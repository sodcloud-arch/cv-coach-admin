name: Autopilot Review Queue Patch V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-autopilot-review-queue.py"
      - ".github/workflows/autopilot-review-queue-patch-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review queue recovery patch
        run: python3 scripts/patch-autopilot-review-queue.py
      - name: Validate Autopilot self-review
        run: |
          bash -n scripts/autopilot-self-review.sh
          git diff --check
          grep -q 'skipping stale/non-reviewable PR' scripts/autopilot-self-review.sh
      - name: Commit patch
        run: |
          git config user.name 'sodcloud-arch'
          git config user.email 'sodcloud@gmail.com'
          git add scripts/autopilot-self-review.sh
          git commit -m 'fix: recover Autopilot review queue past stale PRs'
          git push origin HEAD:main
