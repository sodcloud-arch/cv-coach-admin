name: Validate F1.M2.S5 Org Admin

on:
  pull_request:
    paths:
      - "supabase/migrations/202609190520_f1_m2_s5_org_admin_multirole.sql"
      - "scripts/test-f1-m2-s5-org-admin.py"
      - ".github/workflows/validate-f1-m2-s5-org-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  org-admin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m2-s5-org-admin.py
