name: CV Coach Deploy AI Comparison UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-deploy-ai-comparison-v1.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-ai-comparison-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_fkeoRxjDY3ZDQlIadS1EaIowFi87
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - uses: actions/checkout@v4

      - name: Validate comparison source
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'openAiGenerationComparison' index.html
          grep -q 'Rutina anterior vs nueva rutina' index.html
          grep -q 'VER CAMBIOS' index.html
          grep -q 'await openAiGenerationComparison(result.generation_id)' index.html

      - name: Deploy Admin production
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify public production
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl -fsSL --max-time 20 https://cv-coach-admin.vercel.app || true)"
            if [[ "$body" == *'openAiGenerationComparison'* && "$body" == *'Rutina anterior vs nueva rutina'* && "$body" == *'VER CAMBIOS'* && "$body" == *'Snapshot exacto tomado antes de generar'* ]]; then
              echo 'PUBLIC_AI_COMPARISON_V1_OK'
              exit 0
            fi
            sleep 3
          done
          echo 'AI comparison production verification failed' >&2
          exit 1

      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneshot-deploy-ai-comparison-v1.yml
          git commit -m 'chore: remove AI comparison deployment workflow'
          git push origin HEAD:main
