name: CV Coach PR16 Empty Body Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr16-req-empty-body-fix.yml"

permissions:
  contents: write

jobs:
  patch-pr16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate existing Autopilot branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='autopilot/2d6fb5f4-program_editor_days_ui'
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            (
              "if(r.status===204)return null;return r.json()",
              "if(r.status===204)return null;let text=await r.text();if(!text)return null;try{return JSON.parse(text)}catch{throw Error('Respuesta inválida del servidor')}"
            ),
            (
              "catch(e=>toast('No se pudo eliminar el día: '+e.message))});$('#publishProgram')",
              "catch(e=>toast('No se pudo eliminar el día: '+e.message)))});$('#publishProgram')"
            )
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'expected exactly 1 occurrence, found {count}: {old[:70]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/pr16.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/pr16.js
          git add index.html
          git commit -m "autopilot: repair program editor validation issues"
          git push origin "HEAD:${BRANCH}"
