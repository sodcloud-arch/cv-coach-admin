name: Fix Communications V1 Idempotency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-communications-v1-idempotency.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic fix
        run: python3 scripts/fix-communications-v1-idempotency.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-admin-communications-idempotency.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-admin-communications-idempotency.js

      - name: Validate audit contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          start=text.index('function communicationNewIdempotency')
          end=text.index('function subscriptionBlockHtml',start)
          block=text[start:end]
          assert "globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function'" in block
          assert 'globalThis.crypto.randomUUID()' in block
          assert 'let effectiveKey=key;' in block
          assert "initial?.idempotency_key||communicationNewIdempotency(client.id,messageType)" not in block
          forbidden=['graph.facebook.com','api.whatsapp.com','sendMessage','send_message','send-whatsapp','/functions/v1/','service_role','OPENAI_API_KEY']
          found=[x for x in forbidden if x in block]
          if found: raise SystemExit('External send surface detected: '+', '.join(found))
          PY
          git diff --check

      - name: Commit fix and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-communications-v1-idempotency.py .github/workflows/fix-communications-v1-idempotency.yml
          git add index.html
          git commit -m "fix(admin): align Communications V1 idempotency audit"
          git push origin HEAD:main

      - name: Dispatch canonical Admin production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-admin-production.yml --ref main
