name: Autopilot Review Queue Recovery Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autopilot-review-queue-recovery-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stale PR selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/autopilot-self-review.sh')
          s=p.read_text()
          old='''find_review_pr() {
  gh pr list --state open --limit 30 \\
    --json number,url,title,body,isDraft,headRefName,baseRefName,createdAt \\
    | jq -c '[.[] | select(.baseRefName=="main" and (.headRefName|startswith("autopilot/")) and (((.body // "")|contains("AUTOPILOT_EXTERNAL_REQUEST_ID:"))))] | sort_by(.createdAt) | .[0] // empty'
}'''
          new='''find_review_pr() {
  local pr body request_id ctx kind status
  while IFS= read -r pr; do
    [[ -z "${pr}" ]] && continue
    body="$(jq -r '.body // ""' <<<"${pr}")"
    request_id="$(printf '%s\\n' "${body}" | sed -n 's/^AUTOPILOT_EXTERNAL_REQUEST_ID: //p' | head -n 1)"
    [[ -z "${request_id}" ]] && continue
    ctx="$(review_context "${request_id}" 2>/dev/null || true)"
    kind="$(jq -r '.kind // empty' <<<"${ctx}" 2>/dev/null || true)"
    status="$(jq -r '.result.request_status // empty' <<<"${ctx}" 2>/dev/null || true)"
    if [[ "${kind}" == "AI_REVIEW_CONTEXT" && "${status}" == "WAITING_REVIEW" ]]; then
      printf '%s\\n' "${pr}"
      return 0
    fi
    echo "Autopilot self-review: skipping stale/non-reviewable PR #$(jq -r '.number' <<<"${pr}") request_status=${status:-unknown}" >&2
  done < <(gh pr list --state open --limit 30 \\
    --json number,url,title,body,isDraft,headRefName,baseRefName,createdAt \\
    | jq -c '[.[] | select(.baseRefName=="main" and (.headRefName|startswith("autopilot/")) and (((.body // "")|contains("AUTOPILOT_EXTERNAL_REQUEST_ID:"))))] | sort_by(.createdAt)[]')
  return 0
}'''
          if old not in s:
              raise SystemExit('expected find_review_pr block not found')
          p.write_text(s.replace(old,new,1))
          PY
          bash -n scripts/autopilot-self-review.sh
          git diff --check
          grep -q 'skipping stale/non-reviewable PR' scripts/autopilot-self-review.sh
          git config user.name 'sodcloud-arch'
          git config user.email 'sodcloud@gmail.com'
          git add scripts/autopilot-self-review.sh
          git commit -m 'fix: skip stale PRs in Autopilot review queue'
          git push origin HEAD:main
