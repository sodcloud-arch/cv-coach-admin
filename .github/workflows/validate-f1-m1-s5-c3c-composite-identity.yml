name: Validate F1.M1.S5 C3C Composite Identity

on:
  pull_request:
    paths:
      - "supabase/migrations/202609190130_f1_m1_s5_c3c_composite_identity_cutover_arch1.sql"
      - "scripts/test-f1-m1-s5-c3c-composite-identity.py"
      - ".github/workflows/validate-f1-m1-s5-c3c-composite-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c3c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-c3c-composite-identity.py
