name: Validate F1.M1.S5 H3B1 Tenant Hardening

on:
  pull_request:
    paths:
      - "supabase/migrations/202609190030_f1_m1_s5_h3b1_billing_lifecycle_system_scope_arch1.sql"
      - "scripts/test-f1-m1-s5-h3b1-tenant-hardening.py"
      - ".github/workflows/validate-f1-m1-s5-h3b1-tenant-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h3b1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-h3b1-tenant-hardening.py
