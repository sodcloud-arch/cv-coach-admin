name: V78 KPI one-shot

on:
  push:
    branches:
      - fix/v78-library-state-kpi
    paths:
      - .github/workflows/v78-kpi-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v78-library-state-kpi
          fetch-depth: 0
      - name: Patch staging semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-assets/v78-library.js')
          s = p.read_text()
          old_counts = "staging:rows.filter(r=>!r.x.active).length"
          new_counts = "staging:rows.filter(r=>r.state==='staging').length"
          old_filter = "const stateMatch=s==='all'||r.state===s||(s==='staging'&&!x.active);"
          new_filter = "const stateMatch=s==='all'||r.state===s;"
          assert s.count(old_counts) == 1, 'unexpected staging count contract'
          assert s.count(old_filter) == 1, 'unexpected staging filter contract'
          s = s.replace(old_counts, new_counts).replace(old_filter, new_filter)
          p.write_text(s)
          PY
          rm .github/workflows/v78-kpi-one-shot.yml
          git config user.name "CV Coach Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v78): separar staging de bloqueados"
          git push origin HEAD:fix/v78-library-state-kpi
