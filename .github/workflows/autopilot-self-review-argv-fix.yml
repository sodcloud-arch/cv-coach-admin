name: CV Coach Autopilot Self Review ARG_MAX Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autopilot-self-review-argv-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch large review input handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/autopilot-self-review.sh')
          s=p.read_text()
          old='''body_file="$(mktemp)"\nresponse_file="$(mktemp)"\nreview_file="$(mktemp)"\ntrap 'rm -f "${body_file}" "${response_file}" "${review_file}" /tmp/cv-autopilot-review-inline.js "${TARGET_PATH}.self-review-backup"' EXIT'''
          new='''body_file="$(mktemp)"\nresponse_file="$(mktemp)"\nreview_file="$(mktemp)"\nsource_file="$(mktemp)"\ndiff_file="$(mktemp)"\nreview_input_file="$(mktemp)"\ntrap 'rm -f "${body_file}" "${response_file}" "${review_file}" "${source_file}" "${diff_file}" "${review_input_file}" /tmp/cv-autopilot-review-inline.js "${TARGET_PATH}.self-review-backup"' EXIT'''
          if s.count(old)!=1:
              raise SystemExit(f'temp-file block match count={s.count(old)}')
          s=s.replace(old,new,1)
          start='  current_source="$(cat "${TARGET_PATH}")"\n'
          end='    > "${body_file}"'
          if s.count(start)!=1:
              raise SystemExit(f'review-input start match count={s.count(start)}')
          a=s.index(start)
          b=s.index(end,a)+len(end)
          replacement='''  cat "${TARGET_PATH}" > "${source_file}"\n  git diff --no-ext-diff --unified=0 origin/main...HEAD -- "${TARGET_PATH}" > "${diff_file}"\n  jq -nr \\\n    --arg mission_key "${mission_key}" \\\n    --arg action_key "${action_key}" \\\n    --arg action_title "${action_title}" \\\n    --arg instructions "${action_instructions}" \\\n    --arg request_payload "${request_payload}" \\\n    --arg action_payload "${action_payload}" \\\n    --arg pr_title "${pr_title}" \\\n    --rawfile diff "${diff_file}" \\\n    --rawfile source "${source_file}" \\\n    '\"MISSION: \"+$mission_key+\"\\nACTION: \"+$action_key+\"\\nTITLE: \"+$action_title+\"\\nORIGINAL INSTRUCTIONS:\\n\"+$instructions+\"\\nREQUEST PAYLOAD:\\n\"+$request_payload+\"\\nACTION PAYLOAD:\\n\"+$action_payload+\"\\nPR TITLE: \"+$pr_title+\"\\n\\nCURRENT DIFF VS MAIN:\\n\"+$diff+\"\\n\\nCURRENT BRANCH index.html:\\n\"+$source' \\\n    > "${review_input_file}"\n\n  jq -n \\\n    --arg model "${model}" \\\n    --arg instructions "${review_system}" \\\n    --rawfile input "${review_input_file}" \\\n    --argjson max_output_tokens "${review_max_tokens}" \\\n    --argjson schema "${schema}" \\\n    '{model:$model,instructions:$instructions,input:$input,store:false,max_output_tokens:$max_output_tokens,text:{format:{type:\"json_schema\",name:\"cv_autopilot_self_review_v1\",strict:true,schema:$schema}}}' \\\n    > "${body_file}"'''
          s=s[:a]+replacement+s[b:]
          p.write_text(s)
          PY
          bash -n scripts/autopilot-self-review.sh
          tmp_big="$(mktemp)"
          python3 - "$tmp_big" <<'PY'
          import sys
          open(sys.argv[1],'w').write('X'*500000)
          PY
          jq -nr --rawfile source "$tmp_big" '"SOURCE:\n"+$source' > /tmp/review-input-large.txt
          jq -n --rawfile input /tmp/review-input-large.txt '{input:$input}' > /tmp/review-body-large.json
          jq -e '.input|length > 500000' /tmp/review-body-large.json >/dev/null
          rm -f "$tmp_big" /tmp/review-input-large.txt /tmp/review-body-large.json
          git diff --check
          git add scripts/autopilot-self-review.sh
          git commit -m "fix: make Autopilot self-review handle large source inputs"
          git push origin HEAD:main
