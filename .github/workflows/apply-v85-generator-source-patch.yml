name: CV Coach V85 Apply Generator Source Patch

on:
  push:
    branches: [feature/v85-mesocycle-intelligence]
    paths:
      - "scripts/upgrade_generate_ai_program_v85.py"
      - ".github/workflows/apply-v85-generator-source-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v85-mesocycle-intelligence
      - name: Apply deterministic V85 generator patch
        run: python scripts/upgrade_generate_ai_program_v85.py
      - name: Commit patched generator source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/generate-ai-program/index.ts; then
            echo CV_V85_GENERATOR_SOURCE_ALREADY_CURRENT
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/generate-ai-program/index.ts
          git commit -m "V85: connect mesocycle memory to AI generator"
          git push origin HEAD:feature/v85-mesocycle-intelligence
          echo CV_V85_GENERATOR_SOURCE_PATCH_COMMITTED
