name: TEMP Apply Training Focus V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-training-focus-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/patch-training-focus-v1.py

      - name: Validate patched markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'ob_muscle_focus' client-portal/index.html
          grep -q 'onboardingMuscleFocusValue' client-portal/index.html
          grep -q 'manageTrainingFocus' index.html
          grep -q 'set_client_training_focus_backend' index.html

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-portal/index.html index.html
          git commit -m 'feat(onboarding): add editable muscle focus preference'
          git push origin HEAD:main
