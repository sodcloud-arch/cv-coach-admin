name: CV Coach Program Quality Guardrails V2

on:
  push:
    branches:
      - feature/program-quality-guardrails-v2
    paths:
      - '.github/workflows/oneshot-program-quality-guardrails-v2.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-program-quality-guardrails-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/program-quality-guardrails-v2

      - name: Apply program quality guardrails patch
        run: |
          set -euo pipefail
          python scripts/oneshot-program-quality-guardrails-v2.py

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'cv-safety-audit-v1' supabase/functions/generate-ai-program/index.ts
          grep -q 'training_constraints' supabase/functions/generate-ai-program/index.ts
          grep -q 'time_learning' supabase/functions/generate-ai-program/index.ts
          grep -q 'CONTROL DE CALIDAD CV COACH' index.html
          grep -q 'PROGRAMACIÓN IA · PREFLIGHT' index.html
          grep -q 'GESTIONAR RESTRICCIONES' index.html
          git diff --check

      - name: Commit canonical change and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase/functions/generate-ai-program/index.ts scripts/validate-repo-contracts.py
          git rm -f scripts/oneshot-program-quality-guardrails-v2.py .github/workflows/oneshot-program-quality-guardrails-v2.yml
          git commit -m 'feat(ai): add program quality guardrails v2'
          git push origin HEAD:feature/program-quality-guardrails-v2
