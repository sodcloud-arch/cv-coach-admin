name: PR41 Physical Progress Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr41-physical-progress-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR 41 branch
        uses: actions/checkout@v4
        with:
          ref: autopilot/fa67edfc-client_physical_progress_measurements_ui
          fetch-depth: 0

      - name: Apply deterministic reviewer fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_markup = '</p></div><button id="newMeasurement" class="btn primary">REGISTRAR MEDICIÓN</button></div><div class="kpis">'
          new_markup = '</p></div><div class="kpis">'
          if text.count(old_markup) != 1:
              raise SystemExit(f'expected one duplicated measurement header marker, found {text.count(old_markup)}')
          text = text.replace(old_markup, new_markup, 1)

          old_validation = r"""let status=$('#measurementStatus'),button=$('#saveMeasurement'),date=$('#measurementDate').value.trim(),body={client_id:id,source:'coach'},count=0;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())){status.textContent='La fecha es obligatoria y debe ser válida.';return}"""
          new_validation = r"""let status=$('#measurementStatus'),button=$('#saveMeasurement'),date=$('#measurementDate').value.trim(),body={client_id:id,source:'coach'},count=0,measuredDate=null;if(/^\d{4}-\d{2}-\d{2}$/.test(date)){let [year,month,day]=date.split('-').map(Number),candidate=new Date(year,month-1,day,12,0,0);if(candidate.getFullYear()===year&&candidate.getMonth()===month-1&&candidate.getDate()===day)measuredDate=candidate}if(!measuredDate){status.textContent='La fecha es obligatoria y debe ser válida.';return}"""
          if text.count(old_validation) != 1:
              raise SystemExit(f'expected one measurement date validation marker, found {text.count(old_validation)}')
          text = text.replace(old_validation, new_validation, 1)

          old_measured_at = "body.measured_at=new Date(date+'T12:00:00').toISOString();"
          new_measured_at = "body.measured_at=measuredDate.toISOString();"
          if text.count(old_measured_at) != 1:
              raise SystemExit(f'expected one measured_at assignment, found {text.count(old_measured_at)}')
          text = text.replace(old_measured_at, new_measured_at, 1)

          path.write_text(text)
          PY

      - name: Validate patched branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          if html.count('id="newMeasurement"') != 1:
              raise SystemExit(f'expected one newMeasurement button, found {html.count("id=\"newMeasurement\"")}')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/cv-coach-inline.js').write_text(html[start:end])
          PY
          node --check /tmp/cv-coach-inline.js
          git diff --check
          grep -q 'measuredDate=null' index.html
          grep -q 'body.measured_at=measuredDate.toISOString()' index.html

      - name: Commit reviewer fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cv-coach-autopilot[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'PR 41 reviewer fixes already applied.'
            exit 0
          fi
          git commit -m 'fix: validate physical measurement date and markup'
          git push origin HEAD:autopilot/fa67edfc-client_physical_progress_measurements_ui
