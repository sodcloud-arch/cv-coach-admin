name: Install Admin Weekly Program Review V1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-admin-weekly-program-review-v1.py'
      - '.github/workflows/install-admin-weekly-program-review-v1.yml'
permissions:
  contents: write
  actions: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic Admin patch
        run: python3 scripts/install-admin-weekly-program-review-v1.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-admin-weekly-program-review.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-admin-weekly-program-review.js
      - name: Validate review contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          required=['function weeklyProgramReviewHtml(rows)','weeklyProgramReviews]=await Promise.all','weekly_program_reviews','/rest/v1/rpc/review_weekly_program_review','No modifica la rutina automáticamente','REVISADA','DESCARTADA']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing markers: '+', '.join(missing))
          start=text.index('function weeklyProgramReviewReasonLabel')
          end=text.index('async function programs(){',start)
          block=text[start:end]
          forbidden=["weekly_program_reviews',{method:'POST'","weekly_program_reviews',{method:'PATCH'","weekly_program_reviews',{method:'DELETE'",'service_role','SUPABASE_SERVICE_ROLE_KEY']
          found=[x for x in forbidden if x in block]
          if found: raise SystemExit('Unsafe implementation: '+', '.join(found))
          if block.count('/rest/v1/rpc/review_weekly_program_review')!=1: raise SystemExit('Expected exactly one review RPC path')
          PY
          git diff --check
      - name: Commit validated UI and clean installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/install-admin-weekly-program-review-v1.py .github/workflows/install-admin-weekly-program-review-v1.yml
          git add index.html
          git commit -m "feat(admin): add weekly program review controls v1"
          git push origin HEAD:main
      - name: Dispatch canonical Admin production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-admin-production.yml --ref main
