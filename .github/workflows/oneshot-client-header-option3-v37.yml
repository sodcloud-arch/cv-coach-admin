name: CV Coach Client Header Option 3 V37

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oneshot-client-header-option3-v37.yml'

permissions:
  contents: write

concurrency:
  group: cv-client-header-option3-v37
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply compact branded header
        run: |
          set -euo pipefail
          python scripts/oneshot-client-header-option3-v37.py
      - name: Validate
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'cv-client-header-option3-v37' client-portal/index.html
          grep -q "b.textContent='RUTINA'" client-portal/index.html
          grep -q 'cvNotificationButton' client-portal/index.html
          git diff --check
      - name: Commit canonical change and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-portal/index.html
          git rm -f scripts/oneshot-client-header-option3-v37.py .github/workflows/oneshot-client-header-option3-v37.yml
          git commit -m 'feat(client): apply compact branded mobile header'
          git push origin HEAD:main
