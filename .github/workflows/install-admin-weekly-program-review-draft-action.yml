name: Install Admin Weekly Program Review Draft Action
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-admin-weekly-program-review-draft-action.py'
      - '.github/workflows/install-admin-weekly-program-review-draft-action.yml'
permissions:
  contents: write
  actions: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply draft-action patch
        run: python3 scripts/install-admin-weekly-program-review-draft-action.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-admin-weekly-program-review-draft.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-admin-weekly-program-review-draft.js
      - name: Validate safe draft contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          required=['weeklyProgramReviewDraft','PREPARAR AJUSTE','El programa activo no cambia hasta publicar una nueva versión.','confirmCloneVersion(b.dataset.program,b.dataset.client)','clone_program_version_backend']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing draft-action markers: '+', '.join(missing))
          start=text.index('function weeklyProgramReviewReasonLabel')
          end=text.index('async function programs(){',start)
          block=text[start:end]
          if block.count('weeklyProgramReviewDraft') != 2: raise SystemExit('Unexpected draft-action control count')
          if block.count('confirmCloneVersion(b.dataset.program,b.dataset.client)') != 1: raise SystemExit('Unexpected safe draft handoff count')
          forbidden=["weekly_program_reviews',{method:'POST'","weekly_program_reviews',{method:'PATCH'","weekly_program_reviews',{method:'DELETE'",'SUPABASE_SERVICE_ROLE_KEY','service_role']
          found=[x for x in forbidden if x in block]
          if found: raise SystemExit('Unsafe implementation: '+', '.join(found))
          PY
          git diff --check
      - name: Commit validated action and clean installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/install-admin-weekly-program-review-draft-action.py .github/workflows/install-admin-weekly-program-review-draft-action.yml
          git add index.html
          git commit -m "feat(admin): prepare safe draft from weekly review"
          git push origin HEAD:main
      - name: Dispatch canonical Admin production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-admin-production.yml --ref main
