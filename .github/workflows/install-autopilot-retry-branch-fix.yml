name: Install Autopilot Retry Branch Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-autopilot-retry-branch-fix.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/install-autopilot-retry-branch-fix.py

      - name: Validate shell syntax
        run: bash -n scripts/autopilot-external-executor.sh

      - name: Validate retry continuity contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('scripts/autopilot-external-executor.sh').read_text()
          required=[
            "existing_branch=\"$(jq -r '._existing_branch // empty'",
            "existing_pr_url=\"$(jq -r '._existing_pr_url // empty'",
            'git fetch origin "${existing_branch}"',
            'git checkout -B "${existing_branch}" "origin/${existing_branch}"',
            'pr_url="${existing_pr_url}"',
            'gh pr edit "${pr_url}"',
            'git push origin "HEAD:${branch}"'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing retry continuity markers: '+', '.join(missing))
          if 'git push --force' in text or 'git push -f' in text:
            raise SystemExit('Force push is forbidden')
          if 'checkout -B "${existing_branch}" "origin/${existing_branch}"' not in text:
            raise SystemExit('Retry must start from remote branch head')
          PY
          git diff --check

      - name: Commit fix and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-autopilot-retry-branch-fix.py .github/workflows/install-autopilot-retry-branch-fix.yml
          git add scripts/autopilot-external-executor.sh
          git commit -m "fix(autopilot): continue retries on existing PR branch"
          git push origin HEAD:main
