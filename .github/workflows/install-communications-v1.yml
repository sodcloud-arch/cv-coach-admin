name: Install Communications V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-communications-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Communications V1 patch
        run: python3 scripts/install-communications-v1.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-admin-communications-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-admin-communications-inline.js

      - name: Validate safe communications contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          required=[
            'data-v="communications"',
            "communications:'Comunicaciones'",
            "if(view==='communications')await communications();",
            'async function communications()',
            'set_whatsapp_communication_preference',
            'prepare_communication_draft',
            'PREPARAR WHATSAPP',
            'no existe envío automático',
            'READY significa elegible',
            'communicationSeed',
            "setView('communications')"
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing communications markers: '+', '.join(missing))
          start=text.index('function communicationStatusPill')
          end=text.index('function subscriptionBlockHtml',start)
          block=text[start:end]
          forbidden=[
            'graph.facebook.com','api.whatsapp.com','sendMessage','send_message','send-whatsapp',
            '/functions/v1/','service_role','OPENAI_API_KEY',
            "method:'DELETE'",'method:"DELETE"',"method:'PUT'",'method:"PUT"'
          ]
          found=[x for x in forbidden if x in block]
          if found: raise SystemExit('Unsafe external sending/mutation surface found: '+', '.join(found))
          if block.count("method:'POST'") != 2:
            raise SystemExit('Communications V1 must have exactly two POST calls: preference RPC and draft RPC')
          if "/rest/v1/rpc/set_whatsapp_communication_preference" not in block or "/rest/v1/rpc/prepare_communication_draft" not in block:
            raise SystemExit('Only approved RPC writes are allowed')
          if 'navigator.clipboard' in block:
            raise SystemExit('Communications V1 does not need a hidden clipboard/send path')
          PY
          git diff --check

      - name: Commit validated Communications V1 and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-communications-v1.py .github/workflows/install-communications-v1.yml
          git add index.html
          git commit -m "feat(admin): add safe Communications V1"
          git push origin HEAD:main

      - name: Dispatch canonical Admin production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-admin-production.yml --ref main
