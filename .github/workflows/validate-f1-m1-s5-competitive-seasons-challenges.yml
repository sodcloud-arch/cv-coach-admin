name: Validate F1.M1.S5 Competitive Seasons Challenges

on:
  pull_request:
    paths:
      - "supabase/migrations/202609182330_f1_m1_s5_competitive_seasons_challenges_arch1.sql"
      - "scripts/test-f1-m1-s5-competitive-seasons-challenges.py"
      - ".github/workflows/validate-f1-m1-s5-competitive-seasons-challenges.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  competitive-seasons-challenges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-competitive-seasons-challenges.py
