name: CV Coach PR11 Progression Deterministic Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr11-progression-deterministic-fix.yml"

permissions:
  contents: write

jobs:
  patch-pr11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing Autopilot branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='autopilot/2969ce11-client_progression_review_ui'
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_queries="ws=await table('workout_sessions','client_id=eq.'+id+'&select=*&order=started_at.desc&limit=10'),ms=await table('client_missions','client_id=eq.'+id+'&select=*&order=created_at.desc&limit=10'),notes=await table('coach_client_notes','client_id=eq.'+id+'&select=*&order=created_at.desc&limit=10'),suggestions=await table('progression_suggestions','client_id=eq.'+encodeURIComponent(id)+'&status=eq.pending&select=*&order=created_at.desc').catch(()=>null),"
          new_queries="[ws,ms,notes,suggestions]=await Promise.all([table('workout_sessions','client_id=eq.'+id+'&select=*&order=started_at.desc&limit=10'),table('client_missions','client_id=eq.'+id+'&select=*&order=created_at.desc&limit=10'),table('coach_client_notes','client_id=eq.'+id+'&select=*&order=created_at.desc&limit=10'),table('progression_suggestions','client_id=eq.'+encodeURIComponent(id)+'&status=eq.pending&select=*&order=created_at.desc').catch(()=>null)]),"
          old_reps="recommended=[s.suggested_load??s.recommended_load,s.suggested_rep_range??s.recommended_rep_range??s.suggested_reps??s.recommended_reps].filter(x=>x!=null&&x!=='').join(' · ')||'—'"
          new_reps="recommended=[s.suggested_load??s.recommended_load,(s.suggested_rep_min!=null||s.suggested_rep_max!=null)?((s.suggested_rep_min??'—')+'–'+(s.suggested_rep_max??'—')+' reps'):(s.suggested_rep_range??s.recommended_rep_range??s.suggested_reps??s.recommended_reps)].filter(x=>x!=null&&x!=='').join(' · ')||'—'"
          for label,old,new in [('parallel queries',old_queries,new_queries),('rep range',old_reps,new_reps)]:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/pr11.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/pr11.js
          git add index.html
          git commit -m "autopilot: apply reviewed progression UI improvements"
          git push origin "HEAD:${BRANCH}"
