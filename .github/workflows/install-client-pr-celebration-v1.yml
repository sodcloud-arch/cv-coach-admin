name: Install Client PR Celebration V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-client-pr-celebration-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic PR celebration patch
        run: python3 scripts/install-client-pr-celebration-v1.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('client-portal/index.html').read_text()
          scripts=[x for x in re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,flags=re.S|re.I) if x.strip()]
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-client-pr-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-client-pr-inline.js

      - name: Validate PR contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('client-portal/index.html').read_text()
          required=['function cvPersonalRecordResultHTML','personal_records','NUEVOS RÉCORDS PERSONALES','previous_best_weight_kg','new_best_weight_kg','previous_max_reps','new_max_reps','primera marca de un ejercicio se considera baseline']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing PR celebration markers: '+', '.join(missing))
          start=text.index('function cvPersonalRecordResultHTML')
          end=text.index('function cvFeedbackOptions',start)
          block=text[start:end]
          if 'estimated_1rm' in block.lower() or 'e1rm' in block.lower():
            raise SystemExit('PR celebration must not use estimated 1RM')
          if 'personal_records' not in block:
            raise SystemExit('PR celebration must use server-returned personal_records')
          if "esc(r.exercise_name||'Ejercicio')" not in block:
            raise SystemExit('Exercise name must be escaped')
          PY
          git diff --check

      - name: Commit validated PR celebration and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-client-pr-celebration-v1.py .github/workflows/install-client-pr-celebration-v1.yml
          git add client-portal/index.html
          git commit -m "feat(client): celebrate real personal records"
          git push origin HEAD:main

      - name: Dispatch canonical client production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-client-production.yml --ref main
