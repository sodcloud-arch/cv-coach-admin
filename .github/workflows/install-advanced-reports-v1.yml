name: Install Advanced Reports V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-advanced-reports-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-advanced-reports-v1
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deterministic reports patch
        run: python3 scripts/install-advanced-reports-v1.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-admin-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-admin-inline.js

      - name: Validate reports contract
        run: |
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('index.html').read_text()
          required = [
              'data-v="reports"',
              "reports:'Informes avanzados'",
              "if(view==='reports')await reports();",
              'async function reports()',
              'client_risk_state',
              'Score autoritativo',
              'Resumen para seguimiento',
              'navigator.clipboard.writeText',
              'VER INFORME',
              "timeZone:'America/Santiago'",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing reports markers: ' + ', '.join(missing))
          start = text.index('function reportDateLocal')
          end = text.index('function subscriptionBlockHtml', start)
          report = text[start:end]
          forbidden = ["method:'POST'", 'method:"POST"', "method:'PATCH'", 'method:"PATCH"', "method:'DELETE'", 'method:"DELETE"', '/functions/v1/', 'service_role', 'OPENAI_API_KEY']
          found = [item for item in forbidden if item in report]
          if found:
              raise SystemExit('Reports must remain read-only; found: ' + ', '.join(found))
          if 'toISOString().slice(0,10)' in report or 'toISOString().slice(0, 10)' in report:
              raise SystemExit('Reports must not treat UTC ISO date as Chile local day')
          PY
          git diff --check

      - name: Commit validated reports and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-advanced-reports-v1.py .github/workflows/install-advanced-reports-v1.yml
          git add index.html
          git commit -m "feat(admin): add advanced reports v1"
          git push origin HEAD:main
