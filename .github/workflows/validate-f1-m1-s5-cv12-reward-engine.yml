name: Validate F1.M1.S5 CV12 Reward Engine

on:
  pull_request:
    paths:
      - "supabase/migrations/202609182100_f1_m1_s5_cv12_reward_engine_arch1.sql"
      - "scripts/test-f1-m1-s5-cv12-reward-engine.py"
      - ".github/workflows/validate-f1-m1-s5-cv12-reward-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv12-reward-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-cv12-reward-engine.py
