name: CV Coach Mobile Premium V36

on:
  push:
    branches:
      - feature/mobile-premium-pass-v36
    paths:
      - '.github/workflows/oneshot-mobile-premium-pass-v36.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-mobile-premium-v36
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-premium-pass-v36

      - name: Apply mobile premium pass
        run: |
          set -euo pipefail
          python scripts/oneshot-mobile-premium-pass-v36.py
          python - <<'PY'
          from pathlib import Path
          p=Path('client-portal/index.html')
          html=p.read_text(encoding='utf-8')
          start=html.find('\\n<style id="cv-mobile-premium-v36">')
          if start < 0:
              raise SystemExit('v36 escaped style start not found')
          end_marker='\\n</script>\\n'
          end=html.find(end_marker,start)
          if end < 0:
              raise SystemExit('v36 escaped script end not found')
          end += len(end_marker)
          segment=html[start:end].replace('\\n','\n')
          html=html[:start]+segment+html[end:]
          p.write_text(html,encoding='utf-8')
          print('V36_NEWLINES_NORMALIZED')
          PY

      - name: Validate repository contracts and client syntax
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'cv-mobile-premium-v36' client-portal/index.html
          grep -q 'font-size:36px' client-portal/index.html
          grep -q 'width:27px' client-portal/index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('client-portal/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          for code in scripts:
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(code)
                  name=f.name
              subprocess.run(['node','--check',name],check=True)
          print(f'CLIENT_INLINE_JS_PARSE_OK {len(scripts)}')
          PY
          git diff --check

      - name: Commit canonical changes and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-portal/index.html scripts/validate-repo-contracts.py
          git rm -f scripts/oneshot-mobile-premium-pass-v36.py .github/workflows/oneshot-mobile-premium-pass-v36.yml
          git commit -m 'feat(client): premium mobile readability pass'
          git push origin HEAD:feature/mobile-premium-pass-v36
