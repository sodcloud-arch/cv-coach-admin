name: Install Autopilot Financial Sensitivity V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-autopilot-financial-sensitivity-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic guard patch
        run: python3 scripts/install-autopilot-financial-sensitivity-v2.py

      - name: Validate shell syntax
        run: bash -n scripts/autopilot-self-review.sh

      - name: Validate guard contract
        shell: bash
        run: |
          set -euo pipefail
          file=scripts/autopilot-self-review.sh
          grep -q "Financial vocabulary by itself is not sensitive" "$file"
          grep -q "payment|pagos?" "$file"
          grep -q "crear|create|registrar|register|procesar|process" "$file"
          python3 - <<'PY'
          from pathlib import Path
          t=Path('scripts/autopilot-self-review.sh').read_text()
          start=t.index('sensitive_scan_text=')
          end=t.index('git fetch origin main', start)
          block=t[start:end]
          assert "payment|pago|billing|factur" not in block.split('# Financial vocabulary by itself is not sensitive')[0].split("grep -Eiq '")[-1], 'Financial terms still present in always-sensitive regex'
          assert 'Financial vocabulary by itself is not sensitive' in block
          assert 'move money or mutate' in block
          PY

      - name: Commit validated guard and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-autopilot-financial-sensitivity-v2.py .github/workflows/install-autopilot-financial-sensitivity-v2.yml
          git add scripts/autopilot-self-review.sh
          git commit -m "fix(autopilot): distinguish billing reads from financial mutations"
          git push origin HEAD:main
