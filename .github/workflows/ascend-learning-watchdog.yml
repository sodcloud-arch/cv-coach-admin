name: ASCEND Autopilot Watchdog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ascend-autopilot-watchdog
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token for ASCEND
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ascend-core"
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${URL}")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Run ASCEND Autopilot Tick
        env:
          ASCEND_TOKEN: ${{ steps.oidc.outputs.token }}
          ASCEND_URL: https://fmhcansyxcsqkrivqchr.supabase.co/functions/v1/ascend-gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          body = {
              "op": "autopilot_tick",
              "limit": 500
          }

          req = urllib.request.Request(
              os.environ["ASCEND_URL"],
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ASCEND_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
              if response.status != 200 or not payload.get("ok"):
                  raise SystemExit(f"ASCEND autopilot tick failed: {payload}")

              result = payload.get("result") or {}
              print("ASCEND_AUTOPILOT_TICK_OK")
              print(json.dumps(result, indent=2, sort_keys=True))

              learning = result.get("learning") or {}
              rules = result.get("rules") or {}

              if int(learning.get("failed") or 0) > 0:
                  raise SystemExit(f"ASCEND learning phase reported failures: {result}")

              if int(rules.get("failed") or 0) > 0:
                  raise SystemExit(f"ASCEND rules phase reported failures: {result}")

              print(
                  "ASCEND_SUMMARY",
                  json.dumps({
                      "reasoning_queue": result.get("reasoning_queue"),
                      "planned": rules.get("planned"),
                      "succeeded": rules.get("succeeded"),
                      "blocked_total": rules.get("blocked_total"),
                      "openai_api_enabled": result.get("openai_api_enabled"),
                  }, separators=(",", ":"))
              )
          PY
