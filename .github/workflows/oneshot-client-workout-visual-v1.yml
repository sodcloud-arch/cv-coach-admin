name: CV Coach Client Workout Visual V1

on:
  push:
    branches:
      - feature/client-workout-visual-v1
    paths:
      - '.github/workflows/oneshot-client-workout-visual-v1.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-client-workout-visual-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/client-workout-visual-v1

      - name: Apply client workout visual patch
        run: |
          set -euo pipefail
          python scripts/oneshot-client-workout-visual-v1.py

      - name: Validate portal
        run: |
          set -euo pipefail
          grep -q 'cv-client-workout-v31' client-portal/stable/index.html
          grep -q 'ENTRENAMIENTO DE HOY' client-portal/stable/index.html
          grep -q 'cvExerciseCurrent' client-portal/stable/index.html
          grep -q 'cvRirInput' client-portal/stable/index.html
          grep -q 'RIR stays in data/model but is intentionally hidden' client-portal/stable/index.html
          python scripts/validate-repo-contracts.py
          git diff --check

      - name: Commit canonical change and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-portal/stable/index.html
          git rm -f scripts/oneshot-client-workout-visual-v1.py .github/workflows/oneshot-client-workout-visual-v1.yml
          git commit -m 'feat(client): refresh workout visual hierarchy'
          git push origin HEAD:feature/client-workout-visual-v1
