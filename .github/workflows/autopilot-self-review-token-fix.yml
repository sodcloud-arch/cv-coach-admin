name: CV Coach Autopilot Self Review Token Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autopilot-self-review-token-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand bounded self-review output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/autopilot-self-review.sh')
          s=p.read_text()
          old='review_max_tokens=1800'
          new='review_max_tokens=4000'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one {old!r}, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -q 'review_max_tokens=4000' scripts/autopilot-self-review.sh
          git add scripts/autopilot-self-review.sh
          git commit -m "fix: raise Autopilot self-review output ceiling to 4000"
          git push origin HEAD:main
