name: CV Coach Repository Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repository contracts
        run: python scripts/validate-repo-contracts.py
      - name: Build client stabilized artifact through V65
        shell: bash
        run: |
          set -euo pipefail
          python client-portal/stabilize.py
          python client-portal/consolidate_runtime.py
          python client-portal/consolidate_session_runtime.py
          python client-portal/workout_feedback.py
          python client-portal/upgrade_feedback_v48.py
          python client-portal/upgrade_client_v49.py
          python client-portal/upgrade_client_v50.py
          python client-portal/upgrade_client_v51.py
          python client-portal/upgrade_client_v52.py
          python client-portal/upgrade_client_v53.py
          python client-portal/upgrade_client_v54.py
          python scripts/test-mobile-workout-v54.py
          python client-portal/upgrade_client_v55.py
          python scripts/test-workout-sound-v55.py
          python client-portal/upgrade_client_v56.py
          python scripts/test-set-toggle-runtime-v56.py
          python client-portal/upgrade_client_v57.py
          python scripts/test-client-modules-v57.py
          python scripts/test-client-module-e2e-v58.py
          python client-portal/upgrade_client_v59.py
          python scripts/test-coach-client-loop-v59.py
          python client-portal/upgrade_client_v60.py
          python client-portal/repair_client_v60.py
          python scripts/test-cv-rank-system-v60.py
          python client-portal/upgrade_client_v61.py
          python scripts/test-cv-rank-engine-v61.py
          python scripts/test-cv-rank-ui-v64.py
          python scripts/test-cv-rank-ui-v65.py
          node --check client-portal/assets/cv-rank-real-ui-v64.js
          node --check client-portal/assets/cv-rank-real-ui-v65.js
          python scripts/test-workout-runtime-v52.py
          python scripts/test-client-sound-v53.py
          grep -q 'cv-rank-engine-v61' client-portal/stable/index.html
          grep -q 'cv-rank-real-ui-v65' client-portal/stable/index.html
          grep -q 'cv65LeagueProgress' client-portal/stable/index.html
          grep -q 'PLATINO' client-portal/assets/cv-rank-v61.js
          grep -q 'LEYENDA' client-portal/assets/cv-rank-v61.js
          grep -q 'AÚN <b>SIN RANGO</b>' client-portal/assets/cv-rank-v61.js
          if grep -q 'cv-rank-system-v60-js' client-portal/stable/index.html; then exit 1; fi
          if grep -q 'MAESTRO' client-portal/assets/cv-rank-v61.js; then exit 1; fi
      - name: Validate V61 rank assets
        shell: bash
        run: |
          node --check client-portal/assets/cv-rank-v61.js
          test -s client-portal/assets/cv-rank-v61.css
          for f in bronze silver gold platinum diamond legend; do test -s "client-portal/assets/ranks/cv-rank-${f}-v61.webp"; done
      - name: Validate client inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('client-portal/stable/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          out=Path('/tmp/cv-client-inline');out.mkdir(exist_ok=True)
          for i,script in enumerate(scripts):
              if script.strip():(out/f'{i:03d}.js').write_text(script,encoding='utf-8')
          PY
          for f in /tmp/cv-client-inline/*.js; do node --check "$f"; done
      - name: Build and validate Admin Rank V62
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_admin_rank_v62.py
          python scripts/test-cv-rank-admin-v62.py
          grep -q 'cv-admin-rank-v62' index.html
          grep -q 'data-v="ranking"' index.html
          node --check admin-assets/cv-rank-admin-v62.js
      - name: Validate Admin inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          start=html.find('<script>');end=html.find('</script>',start)
          if start<0 or end<=start: raise SystemExit('Inline Admin script not found')
          Path('/tmp/cv-coach-admin-inline.js').write_text(html[start+len('<script>'):end],encoding='utf-8')
          PY
          node --check /tmp/cv-coach-admin-inline.js
      - name: Validate JSON and shell syntax
        shell: bash
        run: |
          python -m json.tool vercel.json >/dev/null
          bash -n scripts/autopilot-worker.sh
          bash -n scripts/autopilot-external-executor.sh
          bash -n scripts/autopilot-self-review.sh
          git diff --check
