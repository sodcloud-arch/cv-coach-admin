name: Install Workout Feedback V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-workout-feedback-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic feedback patch
        run: python3 scripts/install-workout-feedback-v1.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('client-portal/index.html').read_text()
          scripts=[x for x in re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,flags=re.S|re.I) if x.strip()]
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-client-feedback-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-client-feedback-inline.js

      - name: Validate feedback contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('client-portal/index.html').read_text()
          required=[
            'cv-workout-feedback-v1-css',
            "sb.rpc('save_workout_feedback'",
            "p_client_effort:effort",
            "p_fatigue_score:fatigue",
            "p_pain_score:pain",
            "p_session_notes:notes||null",
            "p_pain_notes:painNotes||null",
            "sb.functions.invoke('complete-workout'",
            'GUARDAR Y FINALIZAR',
            'VOLVER AL ENTRENAMIENTO',
            'bloqueará la progresión automática'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing feedback contract markers: '+', '.join(missing))
          start=text.index('async function cvCompleteWorkoutAfterFeedback')
          end=text.index('function cvOpenWorkoutFeedback',start)
          block=text[start:end]
          if block.index("sb.rpc('save_workout_feedback'") > block.index("sb.functions.invoke('complete-workout'"):
            raise SystemExit('Feedback must be persisted before workout completion')
          if "window.finishWorkout=async()=>{if(mode==='demo')" not in text or 'cvOpenWorkoutFeedback()' not in text:
            raise SystemExit('Finish flow does not open feedback modal')
          if "client_effort" not in block or "fatigue" not in block or "pain" not in block:
            raise SystemExit('Structured feedback is incomplete')
          PY
          git diff --check

      - name: Commit validated feedback and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-workout-feedback-v1.py .github/workflows/install-workout-feedback-v1.yml
          git add client-portal/index.html
          git commit -m "feat(client): capture post-workout feedback v1"
          git push origin HEAD:main

      - name: Dispatch canonical client production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-client-production.yml --ref main
