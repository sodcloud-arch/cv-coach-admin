name: ASCEND Core Event Bridge

on:
  workflow_run:
    workflows:
      - CV Coach Canonical Production Pipeline
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  report:
    if: ${{ github.event.workflow_run.id != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token for ASCEND
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ascend-core"
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${URL}")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Report canonical workflow result to ASCEND CORE
        env:
          ASCEND_TOKEN: ${{ steps.oidc.outputs.token }}
          ASCEND_URL: https://fmhcansyxcsqkrivqchr.supabase.co/functions/v1/ascend-gateway
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HTML_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_STATUS: ${{ github.event.workflow_run.status }}
          WORKFLOW_PR_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          body = {
              "op": "github_workflow_completed",
              "workflow_name": os.environ.get("WORKFLOW_NAME"),
              "run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "run_number": int(os.environ.get("WORKFLOW_RUN_NUMBER") or 0),
              "conclusion": os.environ.get("WORKFLOW_CONCLUSION"),
              "event": os.environ.get("WORKFLOW_EVENT"),
              "head_branch": os.environ.get("WORKFLOW_HEAD_BRANCH"),
              "head_sha": os.environ.get("WORKFLOW_HEAD_SHA"),
              "html_url": os.environ.get("WORKFLOW_HTML_URL"),
              "payload": {
                  "run_attempt": int(os.environ.get("WORKFLOW_ATTEMPT") or 1),
                  "actor": os.environ.get("WORKFLOW_ACTOR"),
                  "status": os.environ.get("WORKFLOW_STATUS"),
                  "pull_requests": json.loads(os.environ.get("WORKFLOW_PR_JSON") or "[]"),
              },
          }

          req = urllib.request.Request(
              os.environ["ASCEND_URL"],
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ASCEND_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
              if response.status != 200 or not payload.get("ok"):
                  raise SystemExit(f"ASCEND ingest failed: {payload}")
              print("ASCEND_EVENT_RECORDED", json.dumps(payload, separators=(",", ":")))
          PY
