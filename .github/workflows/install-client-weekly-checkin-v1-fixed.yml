name: Install Client Weekly Check-in V1 Fixed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-client-weekly-checkin-v1-fixed.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct over-strict installer audit marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/install-client-weekly-checkin-v1.py')
          text=p.read_text()
          old=",'weekly_recovery']"
          new="]"
          if old not in text:
              raise SystemExit('Expected audit marker anchor not found')
          p.write_text(text.replace(old,new,1))
          PY

      - name: Apply deterministic weekly check-in patch
        run: python3 scripts/install-client-weekly-checkin-v1.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('client-portal/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-client-weekly-checkin.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-client-weekly-checkin.js

      - name: Validate weekly check-in contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('client-portal/index.html').read_text()
          required=[
            'cv-weekly-checkin-v1-css',
            "sb.from('weekly_checkins').select('*')",
            "sb.rpc('submit_weekly_checkin'",
            'HACER CHECK-IN · 1 MIN',
            'cvChileWeekStart',
            "timeZone:'America/Santiago'",
            'weeklyCheckinsError',
            'weeklyCheckins:checkins.error',
            'Dolor relevante, sueño muy bajo',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing weekly check-in contract markers: '+', '.join(missing))
          start=text.index('function cvChileLocalParts')
          end=text.index('function progress(){',start)
          block=text[start:end]
          forbidden=[
            "sb.from('weekly_checkins').insert",
            "sb.from('weekly_checkins').update",
            "sb.from('weekly_checkins').delete",
            "toISOString().slice(0,10)",
            'service_role','SUPABASE_SERVICE_ROLE_KEY','OPENAI_API_KEY'
          ]
          found=[x for x in forbidden if x in block]
          if found: raise SystemExit('Unsafe weekly check-in implementation: '+', '.join(found))
          if block.count("sb.rpc('submit_weekly_checkin'") != 1:
            raise SystemExit('Weekly check-in must submit through exactly one approved RPC path')
          nav_start=text.index('<nav class="nav">')
          nav_end=text.index('</nav>',nav_start)
          nav=text[nav_start:nav_end]
          if nav.count('data-view=') != 5 or 'data-view="checkin"' in nav:
            raise SystemExit('Bottom navigation contract changed unexpectedly')
          PY
          git diff --check

      - name: Commit validated weekly check-in and remove installers
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-client-weekly-checkin-v1.py .github/workflows/install-client-weekly-checkin-v1.yml .github/workflows/install-client-weekly-checkin-v1-fixed.yml
          git add client-portal/index.html
          git commit -m "feat(client): add weekly recovery check-in v1"
          git push origin HEAD:main

      - name: Dispatch canonical client production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-client-production.yml --ref main
