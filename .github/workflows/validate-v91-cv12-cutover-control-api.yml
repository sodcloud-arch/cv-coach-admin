name: CV Coach V91 CV12 Cutover Control API Contracts

on:
  push:
    paths:
      - 'supabase/migrations/202609141440_v91_cv12_cutover_control_api.sql'
      - '.github/workflows/validate-v91-cv12-cutover-control-api.yml'
  pull_request:
    paths:
      - 'supabase/migrations/202609141440_v91_cv12_cutover_control_api.sql'
      - '.github/workflows/validate-v91-cv12-cutover-control-api.yml'

jobs:
  validate-v91:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V91 operator contracts
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/migrations/202609141440_v91_cv12_cutover_control_api.sql'
          test -f "$file"
          grep -q 'get_cv12_cutover_control_v91' "$file"
          grep -q 'resolve_cv12_native_client_v91' "$file"
          grep -q 'CV12_CUTOVER_CONTROL_API_V91' "$file"
          grep -q 'provide_real_client_email' "$file"
          grep -q 'provision_real_client_identity' "$file"
          grep -q 'execute_cv12_native_cutover_v90' "$file"
          grep -q 'rollback_cv12_native_cutover_v90' "$file"
          grep -q 'Coach/admin required' "$file"
          if grep -Eq 'insert into public\.workout_sessions|insert into public\.programs|update public\.coach_intelligence_pilots|delete from public\.legacy_cv12|private\.enqueue_event' "$file"; then
            echo 'V91 must remain a read-only control/resolution layer' >&2
            exit 1
          fi
