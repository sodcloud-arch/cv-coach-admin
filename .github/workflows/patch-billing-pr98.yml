name: One-shot PR98 billing deterministic patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-billing-pr98.yml

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'install PR98 billing deterministic patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout billing PR branch
        uses: actions/checkout@v4
        with:
          ref: autopilot/77867c2f-admin_billing_payments_ui
          fetch-depth: 0

      - name: Apply exact deterministic fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            ("<tbody>'+records.map(", "<tbody>'+(records.map("),
            ("}).join('')||'<tr><td colspan=\"9\" class=\"muted\">No hay cobros registrados.</td></tr>'+'</tbody>", "}).join('')||'<tr><td colspan=\"9\" class=\"muted\">No hay cobros registrados.</td></tr>')+'</tbody>"),
            ("<div class=\"stack\">'+visibleSubs.map(", "<div class=\"stack\">'+(visibleSubs.map("),
            ("}).join('')||'<div class=\"card muted\">No hay suscripciones visibles para crear cobros.</div>'+'</div>';if(!records.length)", "}).join('')||'<div class=\"card muted\">No hay suscripciones visibles para crear cobros.</div>')+'</div>';if(!records.length)"),
            ("if(!id)throw Error('El backend no confirmó el cobro con un id válido.');", "if(typeof id!=='string'||!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id))throw Error('El backend no confirmó el cobro con un id válido.');"),
            ("msg.toLowerCase().includes('duplicate')||msg.toLowerCase().includes('unique')?'Ya existe un cobro para esa suscripción y fecha.'", "msg.toLowerCase().includes('duplicate')||msg.toLowerCase().includes('unique')||msg.toLowerCase().includes('already exists')?'Ya existe un cobro para esa suscripción y fecha.'")
          ]
          for old,new in replacements:
            count=s.count(old)
            if count!=1:
              raise SystemExit(f'Expected exactly one occurrence, got {count}: {old[:100]}')
            s=s.replace(old,new,1)
          required=[
            "[ws,measurements,ms,scoreSnapshots,notes,suggestions,nutritionTargets,nutritionLogs,clientHabits,onboardingRows,progress_photos,billingRows]",
            "'/functions/v1/manage-billing'",
            "function billingDateInput(v)",
            "v==='pending'?(localDue&&localDue<=chileToday()?'warn':'blue'):''",
            "billingRows.slice(0,5)",
            "typeof id!=='string'||!/^[0-9a-f]{8}"
          ]
          for marker in required:
            if marker not in s:
              raise SystemExit('Missing required billing marker: '+marker)
          billing_start=s.index('async function billing(){')
          billing_end=s.index('async function plansSubscriptions(){',billing_start)
          billing_block=s[billing_start:billing_end]
          if "'/rest/v1/subscription_billing_records'" in billing_block and ("method:'POST'" in billing_block or "method:'PATCH'" in billing_block or "method:'DELETE'" in billing_block):
            raise SystemExit('Direct billing write detected')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')+len('<script>')
          end=s.find('</script>',start)
          if start < len('<script>') or end < 0:
            raise SystemExit('inline script not found')
          Path('/tmp/cv-admin-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/cv-admin-inline.js
          git diff --check
          git diff -- index.html

      - name: Commit exact fixes to PR branch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes produced'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(admin): finalize billing UI contracts'
          git push origin HEAD:autopilot/77867c2f-admin_billing_payments_ui
