name: Compile CV Agentic Workflows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cv-autopilot-codex.md"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compile agentic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile .github/workflows/cv-autopilot-codex.md

      - name: Verify compiled file exists
        run: test -s .github/workflows/cv-autopilot-codex.lock.yml

      - name: Upload compiled workflow
        uses: actions/upload-artifact@v4
        with:
          name: cv-autopilot-codex-lock
          path: .github/workflows/cv-autopilot-codex.lock.yml
          if-no-files-found: error

      - name: Commit compiled lock if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/cv-autopilot-codex.lock.yml && git ls-files --error-unmatch .github/workflows/cv-autopilot-codex.lock.yml >/dev/null 2>&1; then
            echo "Compiled lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cv-autopilot-codex.lock.yml
          git commit -m "build: compile CV Coach Codex agentic workflow"
          git push origin HEAD:main
