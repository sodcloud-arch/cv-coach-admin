name: CV Coach Autopilot V4 IMPROVE Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-improve-e2e-probe.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  improve-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create deliberately incomplete Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="autopilot/a3c63809-improve-path-e2e"
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          a = '<!-- CV Coach Autopilot IMPROVE E2E A -->'
          b = '<!-- CV Coach Autopilot IMPROVE E2E B -->'
          s = s.replace(a, '').replace(b, '')
          if '<body>' not in s:
              raise SystemExit('missing <body> marker')
          s = s.replace('<body>', '<body>' + a, 1)
          p.write_text(s)
          PY
          git add index.html
          git commit -m "test: inject incomplete V4 review proposal"
          git push origin "HEAD:${BRANCH}"
          gh pr create --draft --base main --head "${BRANCH}" \
            --title "[Autopilot Probe] V4 IMPROVE path" \
            --body $'Controlled fault injection for CV Coach Autopilot V4. The initial proposal intentionally includes marker A and omits marker B. The AI self-review must detect and repair the omission before approval.\n\nAUTOPILOT_EXTERNAL_REQUEST_ID: a3c63809-b4d5-4580-9e7f-bc20f2c3662b'

      - name: Run real AI self-review and self-improvement
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDGE_URL: https://fmhcansyxcsqkrivqchr.supabase.co/functions/v1/autopilot-worker-gateway
          REVIEW_EDGE_URL: https://fmhcansyxcsqkrivqchr.supabase.co/functions/v1/autopilot-review-gateway
          OIDC_AUDIENCE: cv-coach-autopilot
        shell: bash
        run: bash scripts/autopilot-self-review.sh
