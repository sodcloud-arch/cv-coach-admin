name: Validate F1.M1.S5 Workout Reward Engine

on:
  pull_request:
    paths:
      - "supabase/migrations/202609182200_f1_m1_s5_workout_reward_engine_arch1.sql"
      - "scripts/test-f1-m1-s5-workout-reward-engine.py"
      - ".github/workflows/validate-f1-m1-s5-workout-reward-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workout-reward-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-workout-reward-engine.py
