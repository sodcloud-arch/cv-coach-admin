name: CV Coach Admin Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "vercel.json"
      - "admin-assets/**"
      - "scripts/upgrade_admin_rank_v62.py"
      - "scripts/test-cv-rank-admin-v62.py"
      - "scripts/upgrade_admin_progression_v83.py"
      - "scripts/test-admin-progression-v83.py"
      - "scripts/upgrade_admin_adaptive_programming_v84.py"
      - "scripts/test-admin-adaptive-programming-v84.py"
      - "scripts/upgrade_admin_mesocycle_intelligence_v85.py"
      - "scripts/test-admin-mesocycle-intelligence-v85.py"
      - "scripts/upgrade_admin_coach_intelligence_v86.py"
      - "scripts/test-admin-coach-intelligence-v86.py"
      - "scripts/upgrade_admin_communications_v98.py"
      - "scripts/test-admin-communications-v98.py"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-cv-coach-admin-production.yml"
  workflow_dispatch:

concurrency:
  group: cv-coach-admin-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_fkeoRxjDY3ZDQlIadS1EaIowFi87
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
      - name: Build and test Admin through Communications & Adherence V98
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_admin_rank_v62.py
          python scripts/test-cv-rank-admin-v62.py
          grep -q 'cv-admin-rank-v62' index.html
          grep -q 'data-v="ranking"' index.html
          node --check admin-assets/cv-rank-admin-v62.js
          python scripts/upgrade_admin_progression_v83.py
          python scripts/test-admin-progression-v83.py
          grep -q 'cv-admin-progression-v83' index.html
          grep -q 'data-v="progression"' index.html
          node --check admin-assets/cv-progression-admin-v83.js
          python scripts/upgrade_admin_adaptive_programming_v84.py
          python scripts/test-admin-adaptive-programming-v84.py
          grep -q 'cv-admin-adaptive-programming-v84' index.html
          grep -q 'TENDENCIAS V84' index.html
          node --check admin-assets/cv-adaptive-programming-admin-v84.js
          python scripts/upgrade_admin_mesocycle_intelligence_v85.py
          python scripts/test-admin-mesocycle-intelligence-v85.py
          grep -q 'cv-admin-mesocycle-intelligence-v85' index.html
          node --check admin-assets/cv-mesocycle-intelligence-admin-v85.js
          python scripts/upgrade_admin_coach_intelligence_v86.py
          python scripts/test-admin-coach-intelligence-v86.py
          grep -q 'cv-admin-coach-intelligence-v86' index.html
          grep -q 'data-v="intelligence"' index.html
          node --check admin-assets/cv-coach-intelligence-admin-v86.js
          python scripts/upgrade_admin_communications_v98.py
          python scripts/test-admin-communications-v98.py
          grep -q 'cv-admin-communications-adherence-v98' index.html
          node --check admin-assets/cv-communications-adherence-v98.js
      - name: Check Vercel credential
        id: auth
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_MISSING"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_AVAILABLE"
          fi
      - name: Link canonical Vercel project
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull production settings
        if: steps.auth.outputs.available == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production bundle
        if: steps.auth.outputs.available == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
      - name: Deploy canonical production
        if: steps.auth.outputs.available == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Verify public Admin alias through Communications & Adherence V98
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            headers="$(mktemp)"
            body="$(curl --fail --silent --show-error --location --max-time 20 -D "$headers" https://cv-coach-admin.vercel.app || true)"
            rank_js_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-rank-admin-v62.js || true)"
            rank_css_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-rank-admin-v62.css || true)"
            progression_js_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-progression-admin-v83.js || true)"
            adaptive_js_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-adaptive-programming-admin-v84.js || true)"
            mesocycle_js_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-mesocycle-intelligence-admin-v85.js || true)"
            intelligence_js_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-coach-intelligence-admin-v86.js || true)"
            adherence_js_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-communications-adherence-v98.js || true)"
            adherence_js="$(curl --fail --silent --show-error --location --max-time 20 https://cv-coach-admin.vercel.app/admin-assets/cv-communications-adherence-v98.js || true)"
            if [[ "$body" == *"CV Coach"* && "$body" == *"COACH ADMIN"* && "$body" == *"cv-admin-rank-v62"* && "$body" == *"data-v=\"ranking\""* && "$body" == *"cv-admin-progression-v83"* && "$body" == *"data-v=\"progression\""* && "$body" == *"cv-admin-adaptive-programming-v84"* && "$body" == *"TENDENCIAS V84"* && "$body" == *"cv-admin-mesocycle-intelligence-v85"* && "$body" == *"cv-admin-coach-intelligence-v86"* && "$body" == *"data-v=\"intelligence\""* && "$body" == *"cv-admin-communications-adherence-v98"* && "$adherence_js" == *"CV_ADMIN_COMMUNICATIONS_ADHERENCE_V98_READY"* && "$rank_js_status" == "200" && "$rank_css_status" == "200" && "$progression_js_status" == "200" && "$adaptive_js_status" == "200" && "$mesocycle_js_status" == "200" && "$intelligence_js_status" == "200" && "$adherence_js_status" == "200" ]]; then
              grep -qi '^content-security-policy:' "$headers"
              grep -qi '^x-content-type-options: nosniff' "$headers"
              grep -qi '^x-frame-options: DENY' "$headers"
              echo 'PUBLIC_ADMIN_V83_OK'
              echo 'PUBLIC_ADMIN_V84_OK'
              echo 'PUBLIC_ADMIN_V85_OK'
              echo 'PUBLIC_ADMIN_V86_OK'
              echo 'PUBLIC_ADMIN_V98_OK'
              rm -f "$headers"
              exit 0
            fi
            rm -f "$headers"; sleep 3
          done
          echo 'Public Admin V98 verification failed' >&2; exit 1
      - name: Credential blocker marker
        if: steps.auth.outputs.available != 'true'
        run: |
          echo "Production deployment was not attempted because VERCEL_TOKEN is not configured in GitHub Actions Secrets."
          exit 1
