name: Install Admin Workout Feedback V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-admin-workout-feedback-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Admin feedback patch
        run: python3 scripts/install-admin-workout-feedback-v1.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('index.html').read_text()
          scripts=[x for x in re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,flags=re.S|re.I) if x.strip()]
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/cv-admin-feedback-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cv-admin-feedback-inline.js

      - name: Validate read-only feedback contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          required=['function workoutSessionFeedbackHtml','workoutFeedbackPill','Sin feedback post-entrenamiento.','ws.map(workoutSessionFeedbackHtml)','client_effort','fatigue_score','pain_score','pain_notes','session_notes']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing Admin feedback markers: '+', '.join(missing))
          start=text.index('function workoutFeedbackPill')
          end=text.index('async function clientDetail',start)
          block=text[start:end]
          forbidden=["method:'POST'",'method:"POST"',"method:'PATCH'",'method:"PATCH"',"method:'DELETE'",'method:"DELETE"','/functions/v1/','/rest/v1/rpc/']
          found=[x for x in forbidden if x in block]
          if found: raise SystemExit('Feedback renderer must be read-only; found: '+', '.join(found))
          if 'esc(x.session_notes)' not in block or 'esc(x.pain_notes)' not in block:
            raise SystemExit('Feedback notes must be escaped')
          PY
          git diff --check

      - name: Commit validated Admin feedback and remove installer
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/install-admin-workout-feedback-v1.py .github/workflows/install-admin-workout-feedback-v1.yml
          git add index.html
          git commit -m "feat(admin): show post-workout feedback in Ficha 360"
          git push origin HEAD:main

      - name: Dispatch canonical Admin production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cv-coach-admin-production.yml --ref main
