name: Validate F1.M1.S5 Legacy Coach Client Scope

on:
  pull_request:
    paths:
      - "supabase/migrations/202609182400_f1_m1_s5_legacy_coach_client_scope_arch1.sql"
      - "scripts/test-f1-m1-s5-legacy-coach-client-scope.py"
      - ".github/workflows/validate-f1-m1-s5-legacy-coach-client-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-coach-client-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-f1-m1-s5-legacy-coach-client-scope.py
