name: Patch AI Program UI V1

on:
  push:
    branches: [feature/ai-program-generator-v1]
    paths:
      - ".github/workflows/patch-ai-program-ui-v1.yml"
      - "scripts/patch-ai-program-ui-v1.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-program-generator-v1
      - name: Apply deterministic patch
        run: python3 scripts/patch-ai-program-ui-v1.py
      - name: Validate HTML script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          assert 'generate-ai-program' in text
          assert 'configureAiProgramButtons' in text
          assert 'Proveedor IA server-side pendiente de configuración' in text
          print('anchors ok')
          PY
      - name: Commit patched UI
        run: |
          if git diff --quiet -- index.html; then
            echo "No UI changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(ai): connect program editor to secure generator"
          git push origin HEAD:feature/ai-program-generator-v1
