name: CV Coach One-shot AI Review UX Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-ai-review-ux.yml"

permissions:
  contents: write

concurrency:
  group: cv-coach-oneshot-ai-review-ux
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_fkeoRxjDY3ZDQlIadS1EaIowFi87
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - uses: actions/checkout@v4

      - name: Patch AI review UX and focus persistence verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.find('function aiReviewValue(value){')
          end = text.find('let aiProgramCapabilityCache=null;', start)
          if start < 0 or end < 0:
              raise SystemExit('AI review helper anchors not found')

          helpers = r'''function aiReviewDate(value){if(!value)return '—';let d=new Date(String(value));return Number.isNaN(d.getTime())?'—':d.toLocaleString('es-CL')}function aiReviewSeverityClass(severity){let s=String(severity||'').toLowerCase();return s==='critical'||s==='block'?'red':s==='high'||s==='warning'?'warn':s==='info'?'blue':'blue'}function aiReviewWarnings(items){let rows=Array.isArray(items)?items:[];if(!rows.length)return '<div class="muted" style="margin-top:8px"><b>Advertencias:</b> Ninguna.</div>';return '<div style="margin-top:10px"><b>Advertencias</b><div class="stack" style="margin-top:6px">'+rows.map(x=>'<div class="row" style="align-items:flex-start"><span class="pill '+aiReviewSeverityClass(x?.severity)+'">'+esc(String(x?.severity||'info').toUpperCase())+'</span><div class="muted grow">'+esc(x?.message||x?.code||'Advertencia')+'</div></div>').join('')+'</div></div>'}function aiReviewConflicts(items){let rows=Array.isArray(items)?items:[];if(!rows.length)return '<div class="muted" style="margin-top:8px"><b>Conflictos:</b> Ninguno.</div>';return '<div style="margin-top:10px"><b>Conflictos</b><div class="stack" style="margin-top:6px">'+rows.map(x=>'<div class="row" style="align-items:flex-start"><span class="pill '+aiReviewSeverityClass(x?.severity)+'">'+esc(String(x?.severity||'').toUpperCase()||'REVISAR')+'</span><div class="muted grow">'+esc(x?.message||x?.code||'Conflicto')+'</div></div>').join('')+'</div></div>'}function aiReviewExplanations(value){let x=value&&typeof value==='object'?value:{},days=Array.isArray(x.day_rationale)?x.day_rationale:[],summary=String(x.summary||'').trim();if(!summary&&!days.length)return '';return '<div style="margin-top:10px"><b>Por qué la IA propuso esta rutina</b>'+(summary?'<div class="muted" style="margin-top:6px">'+esc(summary)+'</div>':'')+(days.length?'<div class="stack" style="margin-top:8px">'+days.map(d=>'<div class="muted"><b>Día '+esc(d?.day_number??'—')+':</b> '+esc(d?.reason||'Sin explicación')+'</div>').join('')+'</div>':'')+'</div>'}function aiReviewHtml(generation){if(!generation)return '<div class="card muted" style="margin:12px 0">Sin revisión IA persistida para este borrador.</div>';let status=String(generation.status||'—'),label=status==='applied'?'APLICADA AL BORRADOR':status==='prepared'?'PREPARADA':status.toUpperCase();return '<div class="card" style="margin:12px 0;border-color:#274a73"><div class="row"><h2 class="grow" style="margin:0">REVISIÓN IA</h2><span class="pill blue">'+esc(label)+'</span></div><div class="muted" style="margin-top:6px">Generación persistida · '+esc(aiReviewDate(generation.created_at))+'</div>'+aiReviewWarnings(generation.warnings)+aiReviewConflicts(generation.conflicts)+aiReviewExplanations(generation.explanations)+'</div>'}'''
          text = text[:start] + helpers + 'let aiProgramCapabilityCache=null;' + text[end+len('let aiProgramCapabilityCache=null;'):]

          pattern = r"generationReview=generation\?.*?;\$\('#content'\)\.innerHTML="
          text, count = re.subn(pattern, "generationReview=aiReviewHtml(generation);$('#content').innerHTML=", text, count=1)
          if count != 1:
              raise SystemExit(f'AI review render replacement count={count}')

          old = "if(!result?.client_id)throw Error('El backend no confirmó el cambio.');close();cache={};toast('Foco muscular actualizado.');await clientDetail(clientId)"
          new = "if(!result?.client_id)throw Error('El backend no confirmó el cambio.');let verify=await table('client_training_preferences','client_id=eq.'+encodeURIComponent(clientId)+'&select=muscle_focus,source,updated_at'),saved=Array.isArray(verify?.[0]?.muscle_focus)?[...verify[0].muscle_focus].sort():[],expected=[...values].sort();if(JSON.stringify(saved)!==JSON.stringify(expected))throw Error('Supabase no confirmó la persistencia del foco.');close();cache={};toast('Foco muscular actualizado.');await clientDetail(clientId)"
          if old not in text:
              raise SystemExit('Training focus save anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "APLICADA AL BORRADOR" index.html
          grep -q "Por qué la IA propuso esta rutina" index.html
          grep -q "Supabase no confirmó la persistencia del foco" index.html
          grep -q "REGENERAR RUTINA" index.html

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CV Coach Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/oneshot-ai-review-ux.yml
          git commit -m "fix(admin): format AI review and verify focus persistence"
          git push origin HEAD:main

      - name: Deploy patched Admin to production
        if: env.VERCEL_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify public Admin
        if: env.VERCEL_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl --fail --silent --show-error --location --max-time 20 https://cv-coach-admin.vercel.app || true)"
            if [[ "$body" == *"APLICADA AL BORRADOR"* && "$body" == *"Supabase no confirmó la persistencia del foco"* ]]; then
              echo "PUBLIC_ADMIN_AI_REVIEW_UX_OK"
              exit 0
            fi
            sleep 3
          done
          echo "Public Admin verification failed" >&2
          exit 1
