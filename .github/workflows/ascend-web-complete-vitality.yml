name: ASCEND WEB C.V. — Guard + Preview

on:
  push:
    branches:
      - autopilot/web-master-v1
    paths:
      - 'client-portal/marketing/**'
      - '.ascend/web-complete-vitality-autonomous.md'
      - '.ascend/cv-web-master-blueprint.md'
      - '.ascend/shopify-audit.md'
      - '.github/workflows/ascend-web-complete-vitality.yml'
  workflow_dispatch:

concurrency:
  group: ascend-web-complete-vitality-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout autonomous web branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce ASCEND PARALLEL LOCK
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            files="$(git show --pretty='' --name-only "$after")"
          else
            files="$(git diff --name-only "$before" "$after")"
          fi
          echo "$files"
          bad=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              client-portal/marketing/*|.ascend/web-complete-vitality-autonomous.md|.ascend/cv-web-master-blueprint.md|.ascend/shopify-audit.md|.github/workflows/ascend-web-complete-vitality.yml)
                ;;
              *)
                echo "ASCEND_PARALLEL_LOCK_VIOLATION: $path" >&2
                bad=1
                ;;
            esac
          done <<< "$files"
          test "$bad" -eq 0
          echo "ASCEND_WEB_SCOPE_OK"

  deploy-preview:
    needs: scope-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_PmFZQqN9tVEAUgKH8ekcnOoSgNOL
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - name: Checkout autonomous web branch
        uses: actions/checkout@v4

      - name: Validate marketing artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s client-portal/marketing/complete-vitality.html
          grep -q 'Complete Vitality' client-portal/marketing/complete-vitality.html

      - name: Require Vercel credential
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_MISSING' >&2; exit 1; }

      - name: Build isolated static preview
        working-directory: client-portal/marketing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cp complete-vitality.html .vercel/output/static/index.html
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/",
                "dest": "/index.html",
                "headers": {
                  "Cache-Control": "no-store",
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "DENY",
                  "Referrer-Policy": "strict-origin-when-cross-origin",
                  "X-Robots-Tag": "noindex, nofollow"
                }
              },
              {"handle": "filesystem"},
              {"src": "/(.*)", "dest": "/index.html"}
            ]
          }
          JSON

      - name: Deploy isolated Vercel preview
        id: deploy
        working-directory: client-portal/marketing
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ASCEND_WEB_PREVIEW_URL=$url"

      - name: Verify preview endpoint
        shell: bash
        run: |
          set -uo pipefail
          url="${{ steps.deploy.outputs.url }}"
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --location --max-time 20 --output "$body_file" --write-out '%{http_code}' "$url" || true)"
          case "$status" in
            200)
              grep -q 'Complete Vitality' "$body_file" || true
              echo "ASCEND_WEB_PREVIEW_REACHABLE"
              ;;
            401|403|404)
              echo "Preview created; Vercel protection or propagation returned HTTP $status."
              ;;
            *)
              echo "Unexpected preview response: HTTP $status" >&2
              rm -f "$body_file"
              exit 1
              ;;
          esac
          rm -f "$body_file"
