name: CV Coach Client Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'client-portal/index.html'
      - 'client-portal/stabilize.py'
      - 'client-portal/consolidate_runtime.py'
      - 'client-portal/consolidate_session_runtime.py'
      - 'client-portal/manifest.webmanifest'
      - 'client-portal/sw.js'
      - 'client-portal/icon.svg'
      - 'client-portal/assets/**'
      - '.github/workflows/deploy-cv-coach-client-production.yml'
  workflow_dispatch:

concurrency:
  group: cv-coach-client-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_PmFZQqN9tVEAUgKH8ekcnOoSgNOL
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Build stabilized client artifact
        shell: bash
        run: |
          set -euo pipefail
          python client-portal/stabilize.py
          python client-portal/consolidate_runtime.py
          python client-portal/consolidate_session_runtime.py
          test "$(wc -c < client-portal/stable/index.html)" -gt 50000
          grep -qi 'CV Coach' client-portal/stable/index.html
          grep -q "America/Santiago" client-portal/stable/index.html
          grep -q 'manifest.webmanifest' client-portal/stable/index.html
          grep -q 'serviceWorker' client-portal/stable/index.html
          grep -q 'cv-runtime-consolidation-v44' client-portal/stable/index.html
          grep -q 'compactObserverV44' client-portal/stable/index.html
          grep -q 'cv-session-runtime-v46' client-portal/stable/index.html
          grep -q 'async function loadSession' client-portal/stable/index.html
          if grep -q 'Cliente Premium Preview' client-portal/stable/index.html; then
            echo 'Preview title remained in stable artifact' >&2
            exit 1
          fi
          test -s client-portal/manifest.webmanifest
          test -s client-portal/sw.js
          test -s client-portal/icon.svg
          test -s client-portal/assets/cv-isotipo-header-v1.webp

      - name: Check Vercel credential
        id: auth
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_MISSING"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_AVAILABLE"
          fi

      - name: Create explicit Vercel static Build Output
        if: steps.auth.outputs.available == 'true'
        working-directory: client-portal/stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static/assets
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cp index.html .vercel/output/static/index.html
          cp ../manifest.webmanifest .vercel/output/static/manifest.webmanifest
          cp ../sw.js .vercel/output/static/sw.js
          cp ../icon.svg .vercel/output/static/icon.svg
          cp ../assets/cv-isotipo-header-v1.webp .vercel/output/static/assets/cv-isotipo-header-v1.webp
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/",
                "dest": "/index.html",
                "headers": {
                  "Cache-Control": "no-store",
                  "Content-Security-Policy": "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://fmhcansyxcsqkrivqchr.supabase.co wss://fmhcansyxcsqkrivqchr.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests",
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "DENY",
                  "Referrer-Policy": "strict-origin-when-cross-origin",
                  "Permissions-Policy": "camera=(), microphone=(), geolocation=()",
                  "X-Robots-Tag": "noindex, nofollow"
                }
              },
              {
                "src": "/sw.js",
                "dest": "/sw.js",
                "headers": {
                  "Cache-Control": "no-cache, no-store, must-revalidate",
                  "Service-Worker-Allowed": "/",
                  "X-Content-Type-Options": "nosniff"
                }
              },
              {
                "src": "/manifest.webmanifest",
                "dest": "/manifest.webmanifest",
                "headers": {
                  "Cache-Control": "no-cache",
                  "Content-Type": "application/manifest+json; charset=utf-8",
                  "X-Content-Type-Options": "nosniff"
                }
              },
              {
                "src": "/icon.svg",
                "dest": "/icon.svg",
                "headers": {
                  "Cache-Control": "public, max-age=3600",
                  "Content-Type": "image/svg+xml; charset=utf-8",
                  "X-Content-Type-Options": "nosniff"
                }
              },
              {
                "src": "/assets/(.*)",
                "dest": "/assets/$1",
                "headers": {
                  "Cache-Control": "public, max-age=3600",
                  "X-Content-Type-Options": "nosniff"
                }
              },
              { "handle": "filesystem" },
              {
                "src": "/(.*)",
                "dest": "/index.html",
                "headers": {
                  "Cache-Control": "no-store",
                  "Content-Security-Policy": "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://fmhcansyxcsqkrivqchr.supabase.co wss://fmhcansyxcsqkrivqchr.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests",
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "DENY",
                  "Referrer-Policy": "strict-origin-when-cross-origin",
                  "Permissions-Policy": "camera=(), microphone=(), geolocation=()",
                  "X-Robots-Tag": "noindex, nofollow"
                }
              }
            ]
          }
          JSON
          test -s .vercel/output/static/index.html
          test -s .vercel/output/static/manifest.webmanifest
          test -s .vercel/output/static/sw.js
          test -s .vercel/output/static/icon.svg
          test -s .vercel/output/static/assets/cv-isotipo-header-v1.webp
          test -s .vercel/output/config.json

      - name: Deploy CV Coach client production
        if: steps.auth.outputs.available == 'true'
        working-directory: client-portal/stable
        shell: bash
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify public production alias
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            root_headers="$(mktemp)"
            sw_headers="$(mktemp)"
            manifest_headers="$(mktemp)"
            icon_headers="$(mktemp)"
            asset_headers="$(mktemp)"
            root_body="$(curl --fail --silent --show-error --location --max-time 20 -D "$root_headers" https://cv-coach-roan.vercel.app || true)"
            manifest_body="$(curl --fail --silent --show-error --location --max-time 20 -D "$manifest_headers" https://cv-coach-roan.vercel.app/manifest.webmanifest || true)"
            sw_body="$(curl --fail --silent --show-error --location --max-time 20 -D "$sw_headers" https://cv-coach-roan.vercel.app/sw.js || true)"
            icon_body="$(curl --fail --silent --show-error --location --max-time 20 -D "$icon_headers" https://cv-coach-roan.vercel.app/icon.svg || true)"
            asset_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 -D "$asset_headers" https://cv-coach-roan.vercel.app/assets/cv-isotipo-header-v1.webp || true)"
            if [[ "$root_body" == *"CV Coach"* && "$root_body" != *"Cliente Premium Preview"* && "$root_body" == *"America/Santiago"* && "$root_body" == *"manifest.webmanifest"* && "$root_body" == *"cv-client-header-v39"* && "$root_body" == *"cv-isotipo-header-v1.webp"* && "$root_body" == *"cv-runtime-consolidation-v44"* && "$root_body" == *"compactObserverV44"* && "$root_body" == *"cv-session-runtime-v46"* && "$root_body" == *"async function loadSession"* && "$manifest_body" == *'"name": "CV Coach"'* && "$manifest_body" == *'"src": "./icon.svg"'* && "$sw_body" == *"cv-coach-shell"* && "$icon_body" == *"<svg"* && "$asset_status" == "200" ]]; then
              grep -qi '^x-content-type-options: nosniff' "$root_headers"
              grep -qi '^x-frame-options: DENY' "$root_headers"
              grep -qi '^content-security-policy:' "$root_headers"
              grep -qi '^cache-control:.*no-store' "$sw_headers"
              grep -qi '^content-type:.*application/manifest' "$manifest_headers"
              grep -qi '^content-type:.*image/svg' "$icon_headers"
              echo 'PUBLIC_PORTAL_PWA_OK'
              rm -f "$root_headers" "$sw_headers" "$manifest_headers" "$icon_headers" "$asset_headers"
              exit 0
            fi
            rm -f "$root_headers" "$sw_headers" "$manifest_headers" "$icon_headers" "$asset_headers"
            sleep 3
          done
          echo 'Public PWA alias verification failed' >&2
          exit 1

      - name: Credential blocker marker
        if: steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          echo "Client production deployment was not attempted because VERCEL_TOKEN is not configured in GitHub Actions Secrets."
          exit 1
