name: CV Coach Client Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'client-portal/index.html'
      - 'client-portal/stabilize.py'
      - '.github/workflows/deploy-cv-coach-client-production.yml'
  workflow_dispatch:

concurrency:
  group: cv-coach-client-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_PmFZQqN9tVEAUgKH8ekcnOoSgNOL
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Build stabilized client artifact
        shell: bash
        run: |
          set -euo pipefail
          python client-portal/stabilize.py
          test "$(wc -c < client-portal/stable/index.html)" -gt 50000
          grep -qi 'CV Coach' client-portal/stable/index.html
          grep -q "America/Santiago" client-portal/stable/index.html
          if grep -q 'Cliente Premium Preview' client-portal/stable/index.html; then
            echo 'Preview title remained in stable artifact' >&2
            exit 1
          fi

      - name: Check Vercel credential
        id: auth
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_MISSING"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_AVAILABLE"
          fi

      - name: Create explicit Vercel static Build Output
        if: steps.auth.outputs.available == 'true'
        working-directory: client-portal/stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cp index.html .vercel/output/static/index.html
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/",
                "dest": "/index.html",
                "headers": {
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "DENY",
                  "Referrer-Policy": "strict-origin-when-cross-origin",
                  "Permissions-Policy": "camera=(), microphone=(), geolocation=()",
                  "X-Robots-Tag": "noindex, nofollow"
                }
              },
              { "handle": "filesystem" },
              {
                "src": "/(.*)",
                "dest": "/index.html",
                "headers": {
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "DENY",
                  "Referrer-Policy": "strict-origin-when-cross-origin",
                  "Permissions-Policy": "camera=(), microphone=(), geolocation=()",
                  "X-Robots-Tag": "noindex, nofollow"
                }
              }
            ]
          }
          JSON
          test -s .vercel/output/static/index.html
          test -s .vercel/output/config.json

      - name: Deploy CV Coach client production
        if: steps.auth.outputs.available == 'true'
        working-directory: client-portal/stable
        shell: bash
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify public production alias
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            headers="$(mktemp)"
            body="$(curl --fail --silent --show-error --location --max-time 20 -D "$headers" https://cv-coach-roan.vercel.app || true)"
            if [[ "$body" == *"CV Coach"* && "$body" != *"Cliente Premium Preview"* && "$body" == *"America/Santiago"* ]]; then
              grep -qi '^x-content-type-options: nosniff' "$headers"
              grep -qi '^x-frame-options: DENY' "$headers"
              echo 'PUBLIC_PORTAL_OK'
              rm -f "$headers"
              exit 0
            fi
            rm -f "$headers"
            sleep 3
          done
          echo 'Public alias verification failed' >&2
          exit 1

      - name: Credential blocker marker
        if: steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          echo "Client production deployment was not attempted because VERCEL_TOKEN is not configured in GitHub Actions Secrets."
          exit 1
