name: CV Coach Client Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'client-portal/**'
      - 'scripts/test-workout-runtime-v52.py'
      - 'scripts/test-client-sound-v53.py'
      - 'scripts/test-mobile-workout-v54.py'
      - 'scripts/test-workout-sound-v55.py'
      - 'scripts/test-set-toggle-runtime-v56.py'
      - 'scripts/test-client-modules-v57.py'
      - 'scripts/test-client-module-e2e-v58.py'
      - 'scripts/test-coach-client-loop-v59.py'
      - 'scripts/test-cv-rank-system-v60.py'
      - 'scripts/test-cv-rank-engine-v61.py'
      - 'scripts/test-cv-rank-ui-v64.py'
      - 'scripts/test-cv-rank-ui-v65.py'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-cv-coach-client-production.yml'
  workflow_dispatch:

concurrency:
  group: cv-coach-client-production
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
      VERCEL_PROJECT_ID: prj_PmFZQqN9tVEAUgKH8ekcnOoSgNOL
      VERCEL_CLI_VERSION: 59.13.1
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Build and regression-gate client artifact through V65
        shell: bash
        run: |
          set -euo pipefail
          python client-portal/stabilize.py
          python client-portal/consolidate_runtime.py
          python client-portal/consolidate_session_runtime.py
          python client-portal/workout_feedback.py
          python client-portal/upgrade_feedback_v48.py
          python client-portal/upgrade_client_v49.py
          python client-portal/upgrade_client_v50.py
          python client-portal/upgrade_client_v51.py
          python client-portal/upgrade_client_v52.py
          python client-portal/upgrade_client_v53.py
          python client-portal/upgrade_client_v54.py
          python scripts/test-mobile-workout-v54.py
          python client-portal/upgrade_client_v55.py
          python scripts/test-workout-sound-v55.py
          python client-portal/upgrade_client_v56.py
          python scripts/test-set-toggle-runtime-v56.py
          python client-portal/upgrade_client_v57.py
          python scripts/test-client-modules-v57.py
          python scripts/test-client-module-e2e-v58.py
          python client-portal/upgrade_client_v59.py
          python scripts/test-coach-client-loop-v59.py
          python client-portal/upgrade_client_v60.py
          python client-portal/repair_client_v60.py
          python scripts/test-cv-rank-system-v60.py
          python client-portal/upgrade_client_v61.py
          python scripts/test-cv-rank-engine-v61.py
          python scripts/test-cv-rank-ui-v64.py
          python scripts/test-cv-rank-ui-v65.py
          node --check client-portal/assets/cv-rank-real-ui-v64.js
          node --check client-portal/assets/cv-rank-real-ui-v65.js
          python scripts/test-workout-runtime-v52.py
          python scripts/test-client-sound-v53.py

          test "$(wc -c < client-portal/stable/index.html)" -gt 50000
          grep -qi 'CV Coach' client-portal/stable/index.html
          grep -q 'America/Santiago' client-portal/stable/index.html
          grep -q 'cv-rank-engine-v61' client-portal/stable/index.html
          grep -q 'cv-rank-real-ui-v64' client-portal/stable/index.html
          grep -q 'cv-rank-real-ui-v65' client-portal/stable/index.html
          grep -q 'cv64WorkoutRankHud' client-portal/stable/index.html
          grep -q 'cv65LeagueProgress' client-portal/stable/index.html
          grep -q './assets/cv-rank-v61.js' client-portal/stable/index.html
          grep -q './assets/cv-rank-v61.css' client-portal/stable/index.html
          if grep -q 'cv-rank-system-v60-js' client-portal/stable/index.html; then echo 'V60 rank runtime still active' >&2; exit 1; fi
          if grep -q 'cv-rank-system-v60-css' client-portal/stable/index.html; then echo 'V60 rank CSS still active' >&2; exit 1; fi
          if grep -q 'cv-rank-real-ui-v63-js' client-portal/stable/index.html; then echo 'V63 UI runtime still active' >&2; exit 1; fi
          if grep -q 'MAESTRO' client-portal/assets/cv-rank-v61.js; then echo 'Retired rank remained' >&2; exit 1; fi
          for f in tutorial bronze silver gold platinum diamond legend; do test -s "client-portal/assets/ranks/cv-rank-${f}-v61.webp"; done

      - name: Check Vercel credential
        id: auth
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_TOKEN_MISSING'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_TOKEN_AVAILABLE'
          fi

      - name: Create explicit Vercel static Build Output
        if: steps.auth.outputs.available == 'true'
        working-directory: client-portal/stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static/assets/sounds .vercel/output/static/assets/ranks
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cp index.html .vercel/output/static/index.html
          cp ../manifest.webmanifest .vercel/output/static/manifest.webmanifest
          cp ../sw.js .vercel/output/static/sw.js
          cp ../icon.svg .vercel/output/static/icon.svg
          cp ../assets/cv-isotipo-header-v1.webp .vercel/output/static/assets/cv-isotipo-header-v1.webp
          cp ../assets/cv-rank-v61.js .vercel/output/static/assets/cv-rank-v61.js
          cp ../assets/cv-rank-v61.css .vercel/output/static/assets/cv-rank-v61.css
          cp ../assets/sounds/*.mp3 .vercel/output/static/assets/sounds/
          cp ../assets/ranks/*.webp .vercel/output/static/assets/ranks/
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {"src":"/","dest":"/index.html","headers":{"Cache-Control":"no-store","Content-Security-Policy":"default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://fmhcansyxcsqkrivqchr.supabase.co wss://fmhcansyxcsqkrivqchr.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests","X-Content-Type-Options":"nosniff","X-Frame-Options":"DENY","Referrer-Policy":"strict-origin-when-cross-origin","Permissions-Policy":"camera=(), microphone=(), geolocation=()","X-Robots-Tag":"noindex, nofollow"}},
              {"src":"/sw.js","dest":"/sw.js","headers":{"Cache-Control":"no-cache, no-store, must-revalidate","Service-Worker-Allowed":"/","X-Content-Type-Options":"nosniff"}},
              {"src":"/manifest.webmanifest","dest":"/manifest.webmanifest","headers":{"Cache-Control":"no-cache","Content-Type":"application/manifest+json; charset=utf-8","X-Content-Type-Options":"nosniff"}},
              {"src":"/icon.svg","dest":"/icon.svg","headers":{"Cache-Control":"public, max-age=3600","Content-Type":"image/svg+xml; charset=utf-8","X-Content-Type-Options":"nosniff"}},
              {"src":"/assets/(.*)","dest":"/assets/$1","headers":{"Cache-Control":"public, max-age=3600","X-Content-Type-Options":"nosniff"}},
              {"handle":"filesystem"},
              {"src":"/(.*)","dest":"/index.html","headers":{"Cache-Control":"no-store","Content-Security-Policy":"default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://fmhcansyxcsqkrivqchr.supabase.co wss://fmhcansyxcsqkrivqchr.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests","X-Content-Type-Options":"nosniff","X-Frame-Options":"DENY","Referrer-Policy":"strict-origin-when-cross-origin","Permissions-Policy":"camera=(), microphone=(), geolocation=()","X-Robots-Tag":"noindex, nofollow"}}
            ]
          }
          JSON
          test -s .vercel/output/static/index.html
          test -s .vercel/output/static/assets/cv-rank-v61.js
          test -s .vercel/output/static/assets/cv-rank-v61.css
          for f in tutorial bronze silver gold platinum diamond legend; do test -s ".vercel/output/static/assets/ranks/cv-rank-${f}-v61.webp"; done

      - name: Deploy CV Coach client production
        if: steps.auth.outputs.available == 'true'
        working-directory: client-portal/stable
        shell: bash
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify public production alias through V65
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            headers="$(mktemp)"
            body="$(curl --fail --silent --show-error --location --max-time 20 -D "$headers" https://cv-coach-roan.vercel.app || true)"
            js_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-roan.vercel.app/assets/cv-rank-v61.js || true)"
            css_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-roan.vercel.app/assets/cv-rank-v61.css || true)"
            sw_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 https://cv-coach-roan.vercel.app/sw.js || true)"
            assets_ok=true
            for f in tutorial bronze silver gold platinum diamond legend; do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 20 "https://cv-coach-roan.vercel.app/assets/ranks/cv-rank-${f}-v61.webp?v=64" || true)"
              [[ "$status" == "200" ]] || assets_ok=false
            done
            if [[ "$body" == *"cv-rank-engine-v61"* && "$body" == *"cv-rank-real-ui-v64"* && "$body" == *"cv-rank-real-ui-v65"* && "$body" == *"cv64WorkoutRankHud"* && "$body" == *"cv65LeagueProgress"* && "$body" == *"./assets/cv-rank-v61.js"* && "$body" != *"cv-rank-system-v60-js"* && "$body" != *"cv-rank-real-ui-v63-js"* && "$js_status" == "200" && "$css_status" == "200" && "$sw_status" == "200" && "$assets_ok" == "true" ]]; then
              grep -qi '^x-content-type-options: nosniff' "$headers"
              grep -qi '^x-frame-options: DENY' "$headers"
              grep -qi '^content-security-policy:' "$headers"
              echo 'PUBLIC_PORTAL_CV_RANK_V65_OK'
              rm -f "$headers"
              exit 0
            fi
            rm -f "$headers"
            sleep 3
          done
          echo 'Public CV Rank V65 alias verification failed' >&2
          exit 1

      - name: Vercel credential required for canonical production
        if: steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          echo 'Client production deployment was not attempted because VERCEL_TOKEN is not configured in GitHub Actions Secrets.'
          exit 1
