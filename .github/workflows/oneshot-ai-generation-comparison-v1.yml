name: CV Coach AI Generation Comparison Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-ai-generation-comparison-v1.yml'

permissions:
  contents: write

concurrency:
  group: cv-coach-ai-generation-comparison-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Correct patch anchor and apply comparison patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_ai_generation_comparison_v1.py')
          t=p.read_text(encoding='utf-8')
          old="+aiReviewExplanations(generation)+'</div>'"
          new="+aiReviewExplanations(generation.explanations)+'</div>'"
          if old not in t:
              raise SystemExit('temporary patch anchor not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          python scripts/patch_ai_generation_comparison_v1.py

      - name: Validate comparison contracts
        run: |
          set -euo pipefail
          grep -q 'openAiGenerationComparison' index.html
          grep -q 'Rutina anterior vs nueva rutina' index.html
          grep -q 'VER CAMBIOS' index.html
          grep -q 'Snapshot exacto tomado antes de generar' index.html
          python scripts/validate-repo-contracts.py
          git diff --check

      - name: Commit canonical change and remove temporary patch files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/validate-repo-contracts.py
          git rm scripts/patch_ai_generation_comparison_v1.py .github/workflows/oneshot-ai-generation-comparison-v1.yml
          git commit -m 'feat(admin): compare AI routine before and after generation'
          git push origin HEAD:main
