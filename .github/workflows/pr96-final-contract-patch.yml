name: PR96 Final Contract Patch

on:
  push:
    branches:
      - autopilot/401d1f5d-admin_plans_subscriptions_ui
    paths:
      - .github/workflows/pr96-final-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: autopilot/401d1f5d-admin_plans_subscriptions_ui
          fetch-depth: 0

      - name: Apply deterministic contract fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = [
            (
              "if(!r.ok){let x;try{x=await r.json()}catch{x={message:await r.text()}}throw Error(x.message||x.error_description||x.error||('HTTP '+r.status))}",
              "if(!r.ok){let x;try{x=await r.json()}catch{x={message:await r.text()}}let detail=x?.detail||x?.message||x?.error_description||(typeof x?.error==='string'?x.error:x?.error?.message)||('HTTP '+r.status);throw Error(detail)}"
            ),
            (
              "async function planResponse(path,body){let result=await req(path,{method:'POST',body:JSON.stringify(body)});if(result==null||result.success===false||result.ok===false||result.error){let detail=typeof result?.error==='string'?result.error:result?.error?.message||result?.message;throw Error(detail||'El backend no confirmó la operación.')}return result}",
              "async function planResponse(path,body){let result=await req(path,{method:'POST',body:JSON.stringify(body)}),confirmed=path.endsWith('/manage-plan')?result?.plan_id:path.endsWith('/manage-subscription')?result?.subscription_id:true;if(!confirmed||result==null||result.success===false||result.ok===false||result.error){let detail=result?.detail||result?.message||(typeof result?.error==='string'?result.error:result?.error?.message);throw Error(detail||'El backend no confirmó la operación.')}return result}"
            ),
            (
              "<td><button class=\"btn small editSub\" data-id=\"${esc(s.id)}\">EDITAR</button></td>",
              "<td><button class=\"btn small editSub\" data-id=\"${esc(s.id)}\" ${p?'':'disabled'}>${p?'EDITAR':'REQUIERE ADMIN'}</button></td>"
            )
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one occurrence, got {count}: {old[:100]}')
            s = s.replace(old, new, 1)

          required = [
            "maxlength=\"80\"",
            "maxlength=\"200\"",
            "within=open.filter",
            "overdue=open.filter",
            "clientDetailToken++",
            "/functions/v1/manage-plan",
            "/functions/v1/manage-subscription",
            "result?.plan_id",
            "result?.subscription_id",
            "x?.detail",
            "REQUIERE ADMIN"
          ]
          for marker in required:
            if marker not in s:
              raise SystemExit(f'missing required marker: {marker}')

          forbidden = [
            "'/rest/v1/client_subscriptions',{method:'POST'",
            "'/rest/v1/client_subscriptions?id=eq.'+encodeURIComponent",
            "'/rest/v1/plans',{method:'POST'",
            "method:'DELETE'" + ",body:JSON.stringify({subscription"
          ]
          for marker in forbidden:
            if marker in s:
              raise SystemExit(f'forbidden direct subscription/plan write marker: {marker}')

          p.write_text(s)
          PY

      - name: Validate HTML JavaScript and diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.find('<script>')
          end = s.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('inline script not found')
          Path('/tmp/admin.js').write_text(s[start + len('<script>'):end])
          PY
          node --check /tmp/admin.js
          git diff --check

      - name: Commit fixes and remove bootstrap
        run: |
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr96-final-contract-patch.yml
          git add index.html
          git commit -m "fix(admin): enforce subscription contracts before merge"
          git push origin HEAD:autopilot/401d1f5d-admin_plans_subscriptions_ui
