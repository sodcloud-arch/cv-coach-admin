name: CV Coach Client Workout Feedback V32

on:
  push:
    branches:
      - fix/client-rest-feedback-color-v1
    paths:
      - '.github/workflows/oneshot-client-rest-feedback-v32.yml'

permissions:
  contents: write

concurrency:
  group: cv-client-workout-feedback-v32
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-rest-feedback-color-v1

      - name: Apply client workout feedback v32
        run: |
          set -euo pipefail
          python scripts/oneshot-client-rest-feedback-v32.py

      - name: Validate contracts and syntax
        run: |
          set -euo pipefail
          python scripts/validate-repo-contracts.py
          grep -q 'cv-client-workout-v32' client-portal/index.html
          grep -q 'cvRestVisualV32' client-portal/index.html
          grep -q 'cvSetCheck\[aria-pressed="true"\]' client-portal/index.html
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('client-portal/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          chunks=[]
          for s in scripts:
              if 'src=' not in s:
                  chunks.append(s)
          js='\n;\n'.join(chunks)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); name=f.name
          subprocess.run(['node','--check',name],check=True)
          print('CLIENT_JS_SYNTAX_OK')
          PY

      - name: Commit canonical files and remove temporary patch files
        run: |
          set -euo pipefail
          git config user.name 'CV Coach Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-portal/index.html scripts/validate-repo-contracts.py
          git rm -f scripts/oneshot-client-rest-feedback-v32.py .github/workflows/oneshot-client-rest-feedback-v32.yml
          git commit -m 'fix(client): restore rest feedback and semantic colors'
          git push origin HEAD:fix/client-rest-feedback-color-v1
