name: CV Coach PR16 Delete Warning Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr16-delete-warning-fix.yml"

permissions:
  contents: write

jobs:
  patch-pr16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate PR16
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='autopilot/2d6fb5f4-program_editor_days_ui'
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(!confirm('¿Eliminar este día? Esta acción no se puede deshacer.'))return;"
          new="if(!confirm('¿Eliminar este día? También se eliminarán los ejercicios asignados a este día. Esta acción no se puede deshacer.'))return;"
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'expected exactly 1 delete warning occurrence, found {count}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/pr16-delete-warning.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/pr16-delete-warning.js
          git add index.html
          git commit -m "autopilot: clarify destructive day deletion"
          git push origin "HEAD:${BRANCH}"
