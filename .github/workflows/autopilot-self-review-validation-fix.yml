name: CV Coach Autopilot Self Review Validation Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autopilot-self-review-validation-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch self-review validation and blocker payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/autopilot-self-review.sh')
          s=p.read_text()
          old1='git diff --name-only origin/main -- | grep -v'
          new1='git diff --name-only origin/main...HEAD -- | grep -v'
          if s.count(old1)!=1:
              raise SystemExit(f'expected one validation diff expression, found {s.count(old1)}')
          s=s.replace(old1,new1,1)
          old2='risk_level:$risk}}')
          new2='risk_level:$risk_level}}')
          if s.count(old2)!=1:
              raise SystemExit(f'expected one blocker risk expression, found {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          bash -n scripts/autopilot-self-review.sh
          git diff --check
          grep -q 'git diff --name-only origin/main...HEAD --' scripts/autopilot-self-review.sh
          grep -q 'risk_level:\$risk_level' scripts/autopilot-self-review.sh
          git add scripts/autopilot-self-review.sh
          git commit -m "fix: harden Autopilot self-review validation"
          git push origin HEAD:main
