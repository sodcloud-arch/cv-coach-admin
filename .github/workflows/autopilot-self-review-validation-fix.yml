name: CV Coach Autopilot Self Review Validation Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autopilot-self-review-validation-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch self-review validation and blocker payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/autopilot-self-review.sh')
          s = p.read_text()
          replacements = [
              (
                  'base = subprocess.check_output(["git", "show", f"origin/main:{path.as_posix()}"], text=True)',
                  'base_sha = subprocess.check_output(["git", "merge-base", "origin/main", "HEAD"], text=True).strip()\nbase = subprocess.check_output(["git", "show", f"{base_sha}:{path.as_posix()}"], text=True)'
              ),
              (
                  'git diff --name-only origin/main -- | grep -v',
                  'git diff --name-only "$(git merge-base origin/main HEAD)" -- | grep -v'
              ),
              (
                  'git diff origin/main -- "${TARGET_PATH}"',
                  'git diff "$(git merge-base origin/main HEAD)" -- "${TARGET_PATH}"'
              ),
              (
                  'risk_level:$risk}}',
                  'risk_level:$risk_level}}'
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          bash -n scripts/autopilot-self-review.sh
          git diff --check
          grep -q 'merge-base.*origin/main.*HEAD' scripts/autopilot-self-review.sh
          grep -q 'risk_level:\$risk_level' scripts/autopilot-self-review.sh
          git add scripts/autopilot-self-review.sh
          git commit -m "fix: harden Autopilot self-review validation"
          git push origin HEAD:main
