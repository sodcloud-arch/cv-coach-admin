name: Autopilot Large Source Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autopilot-large-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch executor source transport from argv to rawfile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/autopilot-external-executor.sh')
          s=p.read_text()
          old='  --arg source "${source_text}" \\\n'
          new='  --rawfile source "${TARGET_PATH}" \\\n'
          if s.count(old)!=1:
              raise SystemExit(f'expected one source argv anchor, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          bash -n scripts/autopilot-external-executor.sh
          git diff --check
          grep -q -- '--rawfile source "${TARGET_PATH}"' scripts/autopilot-external-executor.sh
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cv-coach-autopilot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/autopilot-large-source-fix.yml
          git add scripts/autopilot-external-executor.sh .github/workflows/autopilot-large-source-fix.yml
          git commit -m 'fix(autopilot): stream large target source into OpenAI request builder'
          git push origin HEAD:main
