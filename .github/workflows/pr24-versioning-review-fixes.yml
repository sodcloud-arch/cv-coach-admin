name: CV Coach PR24 Versioning Review Fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr24-versioning-review-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review fixes to PR24 branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='autopilot/bb02d569-program_versioning_ui'
          git fetch origin "${BRANCH}" main
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          git config user.name "cv-coach-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css_old='.head{display:flex;justify-content:space-between;gap:16px;align-items:end}.click{cursor:pointer}'
          css_new='.head{display:flex;justify-content:space-between;gap:16px;align-items:end}.headActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.click{cursor:pointer}'
          if s.count(css_old)!=1: raise SystemExit(f'css marker count={s.count(css_old)}')
          s=s.replace(css_old,css_new,1)
          mobile_old='.head{align-items:flex-start;flex-direction:column}.head>.btn{width:100%}'
          mobile_new='.head{align-items:flex-start;flex-direction:column}.head>.btn{width:100%}.headActions{width:100%}.headActions .btn{flex:1;min-width:180px}'
          if s.count(mobile_old)!=1: raise SystemExit(f'mobile marker count={s.count(mobile_old)}')
          s=s.replace(mobile_old,mobile_new,1)
          header_old='<div class="row"> <span class="pill blue">${pr.version==null?\'Versión no disponible\':\'V\'+esc(pr.version)}</span>${draft?\'<button id="publishProgram" class="btn primary">PUBLICAR PROGRAMA</button>\':pr.status===\'active\'?(activeDraft?`<button id="openExistingDraft" class="btn primary">ABRIR BORRADOR V${esc(activeDraft.version)}</button>`:\'<button id="cloneVersion" class="btn primary">CREAR NUEVA VERSIÓN</button>\'):\'\'}</div>'
          header_new='<div class="headActions"><span class="pill blue">${pr.version==null?\'Versión no disponible\':\'V\'+esc(pr.version)}</span>${draft?\'<button id="publishProgram" class="btn primary">PUBLICAR PROGRAMA</button>\':pr.status===\'active\'?(activeDraft?`<button id="openExistingDraft" class="btn primary">${activeDraft.version==null?\'ABRIR BORRADOR\':\'ABRIR BORRADOR V\'+esc(activeDraft.version)}</button>`:\'<button id="cloneVersion" class="btn primary">CREAR NUEVA VERSIÓN</button>\'):\'\'}</div>'
          if s.count(header_old)!=1: raise SystemExit(f'header marker count={s.count(header_old)}')
          s=s.replace(header_old,header_new,1)
          start='function confirmCloneVersion(id,clientId)'
          end='async function programEditor(id)'
          if s.count(start)!=1 or s.count(end)!=1: raise SystemExit('clone/programEditor markers invalid')
          a=s.index(start); b=s.index(end,a)
          fn='''function confirmCloneVersion(id,clientId){$('#modal').innerHTML=`<div class="modal"><div class="card"><div class="row"><div class="grow"><div class="ey">NUEVA VERSIÓN</div><h2>Crear nueva versión</h2></div><button id="closeClone" class="btn small">✕</button></div><p class="sub">La versión activa seguirá funcionando sin cambios. Se copiarán sus días y ejercicios a un nuevo borrador editable. Las fechas de inicio y fin del nuevo borrador quedarán vacías para que el coach las defina.</p><div class="row"><button id="cancelClone" class="btn grow">CANCELAR</button><button id="doClone" class="btn primary grow">CREAR NUEVA VERSIÓN</button></div><div id="cloneStatus" class="status muted"></div></div></div>`;let close=()=>$('#modal').innerHTML='';$('#closeClone').onclick=close;$('#cancelClone').onclick=close;$('#doClone').onclick=async()=>{let b=$('#doClone'),r=$('#cloneStatus');try{b.disabled=true;b.textContent='Creando versión…';r.textContent='';let response=await req('/rest/v1/rpc/clone_program_version_backend',{method:'POST',body:JSON.stringify({p_actor_id:me.id,p_source_program_id:id})});if(!response?.program_id)throw Error('El backend no devolvió un program_id válido.');let label=response.version==null?'nueva versión':'V'+String(response.version);cache={};close();toast('Nueva versión creada: '+label);await programEditor(response.program_id)}catch(e){let message=String(e?.message||e||'Error desconocido');if(message.toLowerCase().includes('client already has a draft program')){try{let fresh=await core(true),latest=fresh.programs.filter(x=>x.client_id===clientId&&x.status==='draft').sort((a,b)=>new Date(b.updated_at||b.created_at||0)-new Date(a.updated_at||a.created_at||0))[0];if(latest){cache={};close();let label=latest.version==null?'borrador':'V'+String(latest.version);toast('Ya existe un borrador. Abriendo '+label);await programEditor(latest.id);return}}catch(refreshError){r.textContent='No se pudo crear la nueva versión: '+message+' · No se pudo actualizar la lista de borradores: '+String(refreshError?.message||refreshError);b.disabled=false;b.textContent='CREAR NUEVA VERSIÓN';return}}r.textContent='No se pudo crear la nueva versión: '+message;b.disabled=false;b.textContent='CREAR NUEVA VERSIÓN'}}}'''
          s=s[:a]+fn+s[b:]
          p.write_text(s)
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/pr24.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/pr24.js
          unexpected="$(git diff --name-only "$(git merge-base origin/main HEAD)" -- | grep -v '^index\.html$' || true)"
          if [[ -n "${unexpected}" ]]; then echo "Unexpected changed files: ${unexpected}" >&2; exit 1; fi
          git add index.html
          git commit -m "autopilot: harden program versioning UX and error recovery"
          git push origin "HEAD:${BRANCH}"
