name: CV Coach Mobile WebKit V74 Silent QA

on:
  push:
    branches: [review/v73-optimal-hardening]
    paths:
      - 'client-portal/**'
      - 'scripts/test-client-mobile-webkit-v71.mjs'
      - 'scripts/test-workout-controller-v71.py'
      - '.github/workflows/mobile-webkit-v71.yml'

permissions:
  contents: read

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build client through V74
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python client-portal/stabilize.py
          python client-portal/consolidate_runtime.py
          python client-portal/consolidate_session_runtime.py
          python client-portal/workout_feedback.py
          python client-portal/upgrade_feedback_v48.py
          python client-portal/upgrade_client_v49.py
          python client-portal/upgrade_client_v50.py
          python client-portal/upgrade_client_v51.py
          python client-portal/upgrade_client_v52.py
          python client-portal/upgrade_client_v53.py
          python client-portal/upgrade_client_v54.py
          python client-portal/upgrade_client_v55.py
          python client-portal/upgrade_client_v56.py
          python client-portal/upgrade_client_v57.py
          python client-portal/upgrade_client_v59.py
          python client-portal/upgrade_client_v60.py
          python client-portal/repair_client_v60.py
          python client-portal/upgrade_client_v61.py
          python client-portal/upgrade_client_v67.py
          python client-portal/upgrade_client_v68.py
          python client-portal/upgrade_client_v69.py
          python client-portal/upgrade_client_v74.py
          python scripts/test-workout-controller-v71.py
          node --check client-portal/assets/cv-workout-numpad-v73.js
          node --check client-portal/assets/cv-workout-interaction-v74.js
          if grep -q 'CVIOSKeyboardV72' client-portal/stable/index.html; then echo 'V72 native-keyboard controller still active' >&2; exit 1; fi

      - name: Install Playwright WebKit
        id: playwright
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Run iPhone-sized V74 workout interaction test
        id: webkit
        if: steps.build.outcome == 'success' && steps.playwright.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory client-portal/stable >/tmp/cv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          CV_TEST_URL=http://127.0.0.1:4173 node scripts/test-client-mobile-webkit-v71.mjs

      - name: Publish compact QA result
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          WEBKIT_OUTCOME: ${{ steps.webkit.outcome }}
        run: |
          echo "CV_V74_BUILD=$BUILD_OUTCOME"
          echo "CV_V74_PLAYWRIGHT=$PLAYWRIGHT_OUTCOME"
          echo "CV_V74_WEBKIT=$WEBKIT_OUTCOME"
          {
            echo '### CV Coach V74 silent QA'
            echo "- Build: $BUILD_OUTCOME"
            echo "- Playwright: $PLAYWRIGHT_OUTCOME"
            echo "- WebKit interaction: $WEBKIT_OUTCOME"
            if [[ "$BUILD_OUTCOME" == "success" && "$PLAYWRIGHT_OUTCOME" == "success" && "$WEBKIT_OUTCOME" == "success" ]]; then
              echo '- Result: PASS'
              echo 'CV_V74_QA_PASS'
            else
              echo '- Result: REVIEW REQUIRED'
              echo 'CV_V74_QA_REVIEW_REQUIRED'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Intentionally no failing exit here: this review-branch workflow is diagnostic.
      # Functional failures are read from step outcomes/logs without generating red CI alerts.
