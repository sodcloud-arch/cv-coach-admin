name: TEMP AI Training Focus Context V1

on:
  push:
    branches: [feature/ai-training-focus-context-v1]
    paths:
      - '.github/workflows/tmp-ai-training-focus-context-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-training-focus-context-v1
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/patch-ai-training-focus-context-v1.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'training_preferences: trainingPreferences' supabase/functions/generate-ai-program/index.ts
          grep -q 'muscle_focus' supabase/functions/generate-ai-program/index.ts
          grep -q 'prioridad muscular VIGENTE' supabase/functions/generate-ai-program/index.ts

      - name: Commit and push source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/generate-ai-program/index.ts
          git commit -m 'feat(ai): consume current muscle focus explicitly'
          git push origin HEAD:feature/ai-training-focus-context-v1
