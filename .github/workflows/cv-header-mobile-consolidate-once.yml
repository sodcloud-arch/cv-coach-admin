name: CV Coach Mobile Header Consolidation

on:
  push:
    paths:
      - '.github/workflows/cv-header-mobile-consolidate-once.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical mobile header patch
        run: |
          python scripts/cv_header_consolidate_once.py
          python scripts/validate-repo-contracts.py
          git diff --check

      - name: Commit result and clean one-shot files
        run: |
          git config user.name "CV Coach Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cv-header-mobile-consolidate-once.yml scripts/cv_header_consolidate_once.py
          git add client-portal/index.html
          git commit -m "feat(client): consolidate definitive mobile header"
          git push origin HEAD:main
