name: Validate ASCEND Continuation Rollover v0.7

on:
  pull_request:
    paths:
      - "supabase/migrations/202609190240_ascend_continuation_rollover_v07.sql"
      - "supabase/functions/ascend-gateway/index.ts"
      - "scripts/test-ascend-continuation-rollover-v07.py"
      - ".github/workflows/validate-ascend-continuation-rollover-v07.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuation-v07:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-ascend-continuation-rollover-v07.py
