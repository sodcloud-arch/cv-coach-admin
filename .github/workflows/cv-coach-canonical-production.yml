name: CV Coach Canonical Production Pipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client-portal/**'
      - 'scripts/build-client-canonical.sh'
      - 'scripts/test-guided-set-logging-v105-browser.mjs'
      - 'scripts/test-active-session-v105-browser.mjs'
      - 'scripts/test-demo-post-workout-v105-browser.mjs'
      - 'scripts/test-finish-guard-v106-browser.mjs'
      - 'scripts/validate-production-v106.mjs'
      - '.github/workflows/cv-coach-canonical-production.yml'
  push:
    branches: [main]
    paths:
      - 'client-portal/**'
      - 'scripts/build-client-canonical.sh'
      - 'scripts/test-guided-set-logging-v105-browser.mjs'
      - 'scripts/test-active-session-v105-browser.mjs'
      - 'scripts/test-demo-post-workout-v105-browser.mjs'
      - 'scripts/test-finish-guard-v106-browser.mjs'
      - 'scripts/validate-production-v106.mjs'
      - '.github/workflows/cv-coach-canonical-production.yml'

permissions:
  contents: read

concurrency:
  group: cv-coach-production-${{ github.ref }}
  cancel-in-progress: true

env:
  CV_PRODUCTION_URL: https://cv-coach-roan.vercel.app
  VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
  VERCEL_PROJECT_ID: prj_PmFZQqN9tVEAUgKH8ekcnOoSgNOL

jobs:
  build-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate pipeline script syntax
        run: |
          bash -n scripts/build-client-canonical.sh
          node --check scripts/validate-production-v106.mjs
          node --check scripts/test-guided-set-logging-v105-browser.mjs
          node --check scripts/test-active-session-v105-browser.mjs
          node --check scripts/test-demo-post-workout-v105-browser.mjs
          node --check scripts/test-finish-guard-v106-browser.mjs

      - name: Build canonical client
        run: bash scripts/build-client-canonical.sh

      - name: Upload exact canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: client-portal/stable/
          if-no-files-found: error
          retention-days: 7

  webkit-logging:
    needs: build-canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: client-portal/stable

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Serve canonical artifact
        run: |
          python3 -m http.server 4175 --directory client-portal/stable >/tmp/cv-webkit-http.log 2>&1 &
          echo $! > /tmp/cv-webkit-http.pid
          sleep 1

      - name: Validate mobile logging in WebKit
        env:
          CV_TEST_URL: http://127.0.0.1:4175
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "WebKit logging attempt $attempt/2"
            if node scripts/test-guided-set-logging-v105-browser.mjs; then
              exit 0
            fi
          done
          exit 1

      - name: Upload WebKit QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-webkit-logging-${{ github.sha }}
          path: artifacts/v105-mobile-current.png
          if-no-files-found: warn
          retention-days: 3

  chromium-active:
    needs: build-canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: client-portal/stable

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve canonical artifact
        run: |
          python3 -m http.server 4176 --directory client-portal/stable >/tmp/cv-chromium-http.log 2>&1 &
          echo $! > /tmp/cv-chromium-http.pid
          sleep 1

      - name: Validate active session in Chromium
        env:
          CV_TEST_URL: http://127.0.0.1:4176
          CV_BROWSER: chromium
        run: node scripts/test-active-session-v105-browser.mjs

      - name: Upload Chromium QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-chromium-active-${{ github.sha }}
          path: artifacts/v105-active-session/*.png
          if-no-files-found: warn
          retention-days: 3

  chromium-post-workout:
    needs: build-canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: client-portal/stable

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve canonical artifact
        run: |
          python3 -m http.server 4178 --directory client-portal/stable >/tmp/cv-post-http.log 2>&1 &
          echo $! > /tmp/cv-post-http.pid
          sleep 1

      - name: Validate post-workout flow in Chromium
        env:
          CV_TEST_URL: http://127.0.0.1:4178
        run: node scripts/test-demo-post-workout-v105-browser.mjs

      - name: Upload post-workout QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-post-workout-${{ github.sha }}
          path: artifacts/v105-post-workout/*.png
          if-no-files-found: warn
          retention-days: 3

  chromium-finish-guard:
    needs: build-canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: client-portal/stable

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve canonical artifact
        run: |
          python3 -m http.server 4179 --directory client-portal/stable >/tmp/cv-guard-http.log 2>&1 &
          echo $! > /tmp/cv-guard-http.pid
          sleep 1

      - name: Validate V106 finish guard in Chromium
        env:
          CV_TEST_URL: http://127.0.0.1:4179
        run: node scripts/test-finish-guard-v106-browser.mjs

      - name: Upload V106 finish-guard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-finish-guard-${{ github.sha }}
          path: artifacts/v106-finish-guard/*.png
          if-no-files-found: warn
          retention-days: 3

  webkit-active-canary:
    needs: build-canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: client-portal/stable

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Serve canonical artifact
        run: |
          python3 -m http.server 4177 --directory client-portal/stable >/tmp/cv-webkit-canary-http.log 2>&1 &
          echo $! > /tmp/cv-webkit-canary-http.pid
          sleep 1

      - name: WebKit active-session canary
        continue-on-error: true
        env:
          CV_TEST_URL: http://127.0.0.1:4177
          CV_BROWSER: webkit
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "WebKit active-session canary attempt $attempt/2"
            if node scripts/test-active-session-v105-browser.mjs; then
              exit 0
            fi
          done
          echo "::warning::WebKit headless active-session canary failed twice. Hard gates remain WebKit logging + Chromium active session."
          exit 1

      - name: Upload WebKit canary screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-webkit-canary-${{ github.sha }}
          path: artifacts/v105-active-session/*.png
          if-no-files-found: warn
          retention-days: 3

  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - build-canonical
      - webkit-logging
      - chromium-active
      - chromium-post-workout
      - chromium-finish-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel deployment credential
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::VERCEL_TOKEN is not configured. Add it as a GitHub Actions repository secret before production deployment can run."
            exit 1
          fi
          echo "Vercel deployment credential available."

      - name: Download exact artifact that passed QA
        uses: actions/download-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: client-portal/stable

      - name: Link artifact to CV Coach Vercel project
        shell: bash
        run: |
          mkdir -p client-portal/stable/.vercel
          cat > client-portal/stable/.vercel/project.json <<JSON
          {
            "orgId": "${VERCEL_ORG_ID}",
            "projectId": "${VERCEL_PROJECT_ID}"
          }
          JSON

      - name: Deploy exact tested artifact to production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy client-portal/stable \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"

      - name: Install production validation browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate production or rollback
        shell: bash
        env:
          CV_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set +e
          node scripts/validate-production-v106.mjs
          STATUS=$?
          set -e

          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::Production validation failed. Rolling back to the previous production deployment."
            (
              cd client-portal/stable
              npx --yes vercel@latest rollback --yes --token "$VERCEL_TOKEN"
            ) || true
            exit "$STATUS"
          fi

          echo "CV_PRODUCTION_PIPELINE_OK"
