name: CV Coach Canonical Production Pipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client-portal/**'
      - 'scripts/build-client-canonical.sh'
      - 'scripts/test-guided-set-logging-v105-browser.mjs'
      - 'scripts/test-active-session-v105-browser.mjs'
      - 'scripts/validate-production-v105.mjs'
      - '.github/workflows/cv-coach-canonical-production.yml'
  push:
    branches: [main]
    paths:
      - 'client-portal/**'
      - 'scripts/build-client-canonical.sh'
      - 'scripts/test-guided-set-logging-v105-browser.mjs'
      - 'scripts/test-active-session-v105-browser.mjs'
      - 'scripts/validate-production-v105.mjs'
      - '.github/workflows/cv-coach-canonical-production.yml'

permissions:
  contents: read

concurrency:
  group: cv-coach-production-${{ github.ref }}
  cancel-in-progress: true

env:
  CV_PRODUCTION_URL: https://cv-coach-roan.vercel.app
  VERCEL_ORG_ID: team_pD5aAwrw2qpbPgoEarWhxcKF
  VERCEL_PROJECT_ID: prj_PmFZQqN9tVEAUgKH8ekcnOoSgNOL

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate pipeline script syntax
        run: |
          bash -n scripts/build-client-canonical.sh
          node --check scripts/validate-production-v105.mjs

      - name: Build canonical client
        run: bash scripts/build-client-canonical.sh

      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Serve canonical build
        run: |
          python3 -m http.server 4175 --directory client-portal/stable >/tmp/cv-canonical-http.log 2>&1 &
          echo $! > /tmp/cv-canonical-http.pid
          sleep 1

      - name: Validate mobile logging in WebKit
        env:
          CV_TEST_URL: http://127.0.0.1:4175
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "WebKit logging attempt $attempt/2"
            if node scripts/test-guided-set-logging-v105-browser.mjs; then
              exit 0
            fi
          done
          exit 1

      - name: Validate active session in Chromium
        env:
          CV_TEST_URL: http://127.0.0.1:4175
          CV_BROWSER: chromium
        run: node scripts/test-active-session-v105-browser.mjs

      - name: WebKit active-session canary
        continue-on-error: true
        env:
          CV_TEST_URL: http://127.0.0.1:4175
          CV_BROWSER: webkit
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "WebKit active-session canary attempt $attempt/2"
            if node scripts/test-active-session-v105-browser.mjs; then
              exit 0
            fi
          done
          echo "::warning::WebKit headless active-session canary failed twice. Hard gates already passed; retaining this as diagnostic telemetry."
          exit 1

      - name: Upload exact production artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}
          path: |
            client-portal/stable/**
            artifacts/**
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel deployment credential
        id: credential
        shell: bash
        run: |
          if [[ -n "${VERCEL_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment credential available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured. Canonical build and QA passed, but production deploy is intentionally skipped."
          fi

      - name: Download exact artifact that passed QA
        if: steps.credential.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cv-coach-canonical-${{ github.sha }}

      - name: Link artifact to CV Coach Vercel project
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p client-portal/stable/.vercel
          cat > client-portal/stable/.vercel/project.json <<JSON
          {
            "orgId": "${VERCEL_ORG_ID}",
            "projectId": "${VERCEL_PROJECT_ID}"
          }
          JSON

      - name: Deploy exact tested artifact to production
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy client-portal/stable             --prod             --yes             --token "$VERCEL_TOKEN"

      - name: Install production validation browser
        if: steps.credential.outputs.available == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate production or rollback
        if: steps.credential.outputs.available == 'true'
        shell: bash
        env:
          CV_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set +e
          node scripts/validate-production-v105.mjs
          STATUS=$?
          set -e

          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::Production validation failed. Rolling back to the previous production deployment."
            (
              cd client-portal/stable
              npx --yes vercel@latest rollback --yes --token "$VERCEL_TOKEN"
            ) || true
            exit "$STATUS"
          fi

          echo "CV_PRODUCTION_PIPELINE_OK"
